<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0e0c">
<title>小六壬占事</title>
<script src="./lunar.min.js"></script>
<style>
:root{
  color-scheme:dark;
  --bg:#0f0e0c;--panel:#181612;--panel2:#211e18;--ink:#e8dfcf;--muted:#a39883;
  --gold:#d4a75b;--gold-soft:rgba(212,167,91,.13);--line:rgba(212,167,91,.24);
  --green:#7aab8a;--red:#c06060;--shadow:0 12px 36px rgba(0,0,0,.22);
}
body.light{
  color-scheme:light;
  --bg:#f5eedc;--panel:#fffaf0;--panel2:#ede4cc;--ink:#403729;--muted:#81745e;
  --gold:#80551e;--gold-soft:rgba(128,85,30,.10);--line:rgba(128,85,30,.25);
  --green:#3d7a52;--red:#9a3030;--shadow:0 12px 30px rgba(75,53,20,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:14px/1.65 "PingFang TC","Microsoft JhengHei",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}
.page{width:min(100%,760px);margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:29px;height:29px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:Georgia,serif;font-size:15px}
.brand-name{font:600 13px/1.2 Georgia,serif;letter-spacing:2.8px;color:var(--gold)}
.brand-sub{font-size:10px;letter-spacing:1.8px;color:var(--muted);margin-top:3px}
.theme-btn{width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--gold);font-size:15px}
.hero{text-align:center;padding:25px 0 18px}
.eyebrow{font:11px Georgia,serif;letter-spacing:3px;color:var(--muted)}
h1{font-size:25px;letter-spacing:5px;font-weight:500;color:var(--gold);margin:5px 0 0}
.hero-note{font-size:12px;color:var(--muted);margin-top:5px;letter-spacing:1px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:16px;margin:0 0 13px;box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-title{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--gold)}
.section-hint{font-size:11px;color:var(--muted)}
.question-label,.field-label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.question-input,.field-select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:10px 11px;min-width:0}
.question-input::placeholder{color:var(--muted);opacity:.7}
.char-count{text-align:right;color:var(--muted);font-size:10px;margin-top:3px}
.auto-row{display:flex;align-items:center;gap:10px;margin-top:14px}
.input-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-label{font-size:12px;color:var(--muted)}
.mode-row{margin:0 0 13px}
.question-row{display:block;margin-bottom:14px}
.question-label span{color:var(--muted)}
.cast-row{margin-top:0}
.cast-row button{flex:1}
#customTimePanel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.manual-submit{width:100%;margin-top:11px}
#customToggle[aria-expanded="true"]{background:var(--gold-soft);border-color:var(--gold)}
.char-count{font-size:10px}
.primary-btn{flex:1;min-height:43px;border:1px solid var(--gold);border-radius:8px;background:var(--gold);color:var(--bg);font-weight:700;letter-spacing:1px;padding:9px 12px}
.primary-btn:active{transform:translateY(1px);opacity:.88}
.secondary-btn{min-height:39px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--gold);padding:8px 13px}
.time-stamp{font-size:11px;color:var(--muted);text-align:center;margin-top:9px;min-height:18px}
.divider{height:1px;background:var(--line);margin:15px 0}
.manual-toggle{display:flex;justify-content:center;margin-top:10px}
.text-btn{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.manual-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:0}
.field-select{padding:9px 8px}
.mode-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 12px}
.mode-switch{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.mode-switch button{border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;padding:5px 12px}
.mode-switch button.active{background:var(--gold-soft);color:var(--gold);box-shadow:inset 0 0 0 1px var(--line)}
.result-empty{padding:25px 10px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:9px;font-size:12px}
.result-top{text-align:center;padding:8px 0 14px}
.result-kicker{font-size:11px;color:var(--muted);letter-spacing:2px}
.result-name{font-size:31px;letter-spacing:5px;color:var(--gold);font-weight:600;margin:3px 0}
.result-tagline{font-size:12px;color:var(--muted)}
.palace-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(66px,auto));gap:8px;margin:8px auto 13px;max-width:450px}
.palace{border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:center;padding:12px 4px 10px;min-width:0;display:flex;flex-direction:column;justify-content:center}
.palace.active{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.palace-name{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap}
.palace-meaning{font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap}
.full-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px auto 13px}
.full-card{min-width:0;text-align:center;padding:13px 5px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.full-card.final{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.full-card-label{font-size:11px;color:var(--muted)}
.full-card-name{font-size:20px;font-weight:700;color:var(--gold);margin:5px 0}
.full-card-number{font-size:12px;color:var(--ink);padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:5px}
.full-card-meta{font-size:11px;color:var(--muted);line-height:1.7}
@media(max-width:430px){.full-grid{gap:6px}.full-card{padding:10px 3px}.full-card-name{font-size:17px}.full-card-meta{font-size:10px}}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.step{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px;text-align:center}
.step-label{font-size:10px;color:var(--muted)}
.step-value{font-size:14px;color:var(--gold);font-weight:700;margin-top:2px}
.step-number{font-size:10px;color:var(--muted)}
.explain{margin-top:13px;padding:12px;border-left:2px solid var(--gold);background:var(--gold-soft);border-radius:0 7px 7px 0}
.explain-title{font-size:12px;color:var(--gold);font-weight:700;margin-bottom:4px}
.explain-text{font-size:12px;color:var(--ink);line-height:1.8}
.result-actions{display:flex;gap:8px;margin-top:13px}
.result-actions button{flex:1}
.records-empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 0}
.record{padding:10px 0;border-top:1px solid var(--line)}
.record:first-child{border-top:0;padding-top:0}
.record-head{display:flex;justify-content:space-between;gap:10px;align-items:center}
.record-question{font-size:13px;color:var(--ink);overflow-wrap:anywhere}
.record-result{font-size:13px;color:var(--gold);font-weight:700;white-space:nowrap}
.record-meta{font-size:10px;color:var(--muted);margin-top:4px}
.record-delete{border:0;background:transparent;color:var(--muted);font-size:11px;padding:4px 0 4px 10px}
.faq details{border-top:1px solid var(--line);padding:10px 0}
.faq details:first-of-type{border-top:0}
.faq summary{cursor:pointer;color:var(--gold);font-size:12px}
.faq p{font-size:12px;color:var(--muted);line-height:1.8;padding:8px 2px 0}
.footer{text-align:center;color:var(--muted);font:10px Georgia,serif;letter-spacing:1.5px;padding:8px 0 18px}
@media(max-width:430px){
 .page{padding-left:12px;padding-right:12px}
 .topbar{margin-left:-12px;margin-right:-12px;padding:0 12px}
 .panel{padding:13px}
 .palace-grid{gap:7px;grid-template-rows:repeat(2,minmax(62px,auto))}
 .palace{padding:9px 2px}
 .palace-name{font-size:12px}
 .palace-meaning{font-size:9px}
 .steps{gap:5px}
 .step{padding:8px 3px}
}

/* Compact layout aligned with the reference calculator and Matrix sub-pages. */
.page{width:min(100%,800px);padding:0 18px 30px}
.datetime-bar{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:13px 8px 12px;color:var(--gold);font-size:13px;line-height:1.7;letter-spacing:.5px;font-variant-numeric:tabular-nums;text-align:center}
.datetime-bar .live-date,.datetime-bar .live-lunar{display:block}
.datetime-bar .live-note{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.topbar{height:auto;min-height:54px;margin:0 -18px;padding:9px 20px}
.topbar h1{font-size:22px;font-weight:500;letter-spacing:3px;color:var(--ink);margin:0}
.brand,.hero{display:none!important}
.panel{box-shadow:none;border-radius:11px;padding:14px 15px}
.section-head{margin-bottom:10px}
.section-title{font-size:13px}
.manual-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:13px}
.field-select{padding:9px 8px}
.auto-row{margin-top:12px}
.auto-row button{flex:1}
.primary-btn{min-height:40px}
.secondary-btn{min-height:40px}
.time-stamp{margin-top:7px}
@media(max-width:680px){
 .page{padding:0 10px 22px}
 .topbar{margin:0 -10px;padding:9px 12px}
 .topbar h1{font-size:20px}
 .panel{padding:13px}
 .manual-fields{gap:6px}
 .field-select{padding:9px 5px;font-size:13px}
}
.mode-description{font-size:11px;line-height:1.75;color:var(--muted);margin:-3px 0 13px;padding:0 2px}
.stage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 13px}
.stage-card{min-width:0;text-align:center;padding:12px 5px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}
.stage-card.final{border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.stage-label{font-size:11px;color:var(--muted)}
.stage-name{font-size:19px;font-weight:700;color:var(--gold);margin:4px 0}
.stage-input{font-size:10px;color:var(--muted);line-height:1.6}
.method-note{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.method-title{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:5px}
.method-text{font-size:11px;line-height:1.8;color:var(--muted)}\n.element-analysis{margin-top:12px;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}\n.relation-row{display:grid;grid-template-columns:auto 16px auto;gap:5px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:11px;color:var(--ink)}\n.relation-arrow{color:var(--gold);text-align:center}\n.relation-row strong{grid-column:1/-1;font-size:10px;font-weight:500;color:var(--gold)}\n.analysis-note{font-size:10px;line-height:1.7;color:var(--muted);margin-top:8px}
@media(max-width:430px){.stage-grid{gap:5px}.stage-card{padding:10px 3px}.stage-name{font-size:17px}.stage-input{font-size:9px}}

/* 三階段解讀：起因、發展、結果以不同色彩建立閱讀順序。 */
.stage-intro{font-size:11px;color:var(--muted);line-height:1.75;margin:2px 0 9px}
.stage-grid{align-items:stretch;gap:9px;margin:10px 0 14px}
.stage-card{--phase:#79a9c7;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;text-align:left;align-items:stretch;padding:11px 9px;border:1px solid color-mix(in srgb,var(--phase) 42%,transparent);background:color-mix(in srgb,var(--phase) 7%,var(--bg));border-radius:10px;box-shadow:none}
.stage-card.phase-start{--phase:#78a9cb}
.stage-card.phase-middle{--phase:#65ad9a}
.stage-card.phase-end{--phase:#d4a75b}
.stage-card.final{border:1px solid var(--phase);background:color-mix(in srgb,var(--phase) 13%,var(--bg));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--phase) 30%,transparent)}
.stage-rail{display:flex;align-items:center;justify-content:center;border-right:1px solid color-mix(in srgb,var(--phase) 42%,transparent);padding-right:6px}
.stage-role{writing-mode:vertical-rl;text-orientation:upright;font-size:11px;letter-spacing:2px;font-weight:700;color:var(--phase);white-space:nowrap}
.stage-content{min-width:0}
.stage-label{font-size:10px;color:var(--phase);font-weight:700;letter-spacing:.5px}
.stage-name{font-size:18px;color:var(--ink);margin:3px 0 2px}
.stage-input{font-size:10px;color:var(--muted);line-height:1.55}
.stage-reading{font-size:11px;line-height:1.75;color:var(--ink);margin-top:7px;overflow-wrap:anywhere}
.stage-card.final .stage-name{color:var(--phase)}
.stage-guide{font-size:11px;color:var(--muted);line-height:1.8;margin:-3px 0 12px;padding:9px 11px;background:var(--panel2);border-radius:8px}
.palace-grid{gap:7px;margin:8px auto 12px}
.palace{border-color:color-mix(in srgb,var(--line) 65%,transparent);background:var(--panel);opacity:.78}
.palace-name{color:var(--muted)}
.palace-meaning{white-space:normal;line-height:1.5}
.palace.active{opacity:1;border-color:var(--gold);background:var(--gold-soft);box-shadow:inset 0 0 0 1px var(--gold)}
.palace.active .palace-name{color:var(--gold)}
@media(max-width:430px){.stage-grid{gap:6px}.stage-card{grid-template-columns:19px minmax(0,1fr);gap:6px;padding:9px 6px}.stage-role{font-size:10px}.stage-name{font-size:16px}.stage-reading{font-size:10px;line-height:1.65}.stage-input{font-size:9px}}
</style>
</head>
<body>
<div class="page">
  <header class="topbar"><h1>小六壬占事</h1><button class="theme-btn" id="themeBtn" type="button" aria-label="切換深淺色">☽</button></header>
  <div class="datetime-bar" aria-label="台灣目前陽曆、農曆日期與時間">
    <time class="live-date" id="liveDate">陽曆：載入中…</time>
    <time class="live-lunar" id="liveLunar">農曆：載入中…</time>
    <span class="live-note">◎ 依你裝置的時間（GMT+8）</span>
  </div>

  <section class="panel">
    <div class="input-row mode-row">
      <span class="row-label">算法模式</span>
      <div class="mode-switch" role="group" aria-label="結果顯示模式">
        <button type="button" data-mode="full">九宮三傳</button>
        <button type="button" class="active" data-mode="simple">六宮掌訣</button>
      </div>
    </div>
    <div class="mode-description" id="modeDescription">六宮掌訣：月起、日起、時落。</div>
    <div class="input-row question-row">
      <label class="question-label" for="question">問事內容 <span>（選填）</span></label>
      <input class="question-input" id="question" maxlength="60" placeholder="輸入想詢問的事情">
      <div class="char-count"><span id="charCount">0</span>/60</div>
    </div>
    <div class="input-row cast-row">
      <button class="primary-btn" id="autoCast" type="button">現在起卦</button>
      <button class="secondary-btn" id="customToggle" type="button" aria-expanded="false">自訂時間</button>
    </div>
    <div id="customTimePanel" hidden>
      <div class="manual-fields" id="manualFields">
        <div><label class="field-label" for="monthSelect">農曆月</label><select class="field-select" id="monthSelect"></select></div>
        <div><label class="field-label" for="daySelect">農曆日</label><select class="field-select" id="daySelect"></select></div>
        <div><label class="field-label" for="hourSelect">時辰</label><select class="field-select" id="hourSelect"></select></div>
      </div>
      <button class="primary-btn manual-submit" id="manualCast" type="button">以自訂時間起卦</button>
    </div>
    <div class="time-stamp" id="timeStamp">尚未起卦</div>
  </section>

  <section class="panel">
    <div class="section-head"><div class="section-title">卦象結果</div></div>
    <div id="resultArea" class="result-empty">尚未起卦<br>取得目前時間，或自行輸入農曆月、日與時辰。</div>
  </section>

  <section class="panel">
    <div class="section-head"><div class="section-title">我的紀錄</div><div class="section-hint">保存在此裝置</div></div>
    <div id="records"><div class="records-empty">還沒有紀錄。<br>起卦後可將結果保存，日後回來驗證。</div></div>
  </section>


</div>

<script>
(function(){
  'use strict';
  const PALACES = [
    {name:'大安',hint:'平穩・守成',desc:'主平穩、安定與守成。事情宜按部就班，重視既有條件，不宜為求快速而躁進。'},
    {name:'留連',hint:'遲滯・牽纏',desc:'主延遲、反覆與牽纏。進展可能較慢，宜先釐清卡點，保留彈性並避免倉促決定。'},
    {name:'速喜',hint:'迅速・喜訊',desc:'主快速、消息與喜慶。事情較容易出現進展或回應，宜把握時機，同時確認細節。'},
    {name:'赤口',hint:'口舌・爭端',desc:'主口舌、摩擦與突發阻礙。溝通宜留意措辭，重要事項最好留下清楚紀錄。'},
    {name:'小吉',hint:'助力・漸進',desc:'主小成、助力與漸進。適合透過合作、協調與持續累積推動事情。'},
    {name:'空亡',hint:'落空・變數',desc:'主不確定、落空或虛耗。宜重新檢查前提與資訊，不宜只憑單一訊號下定論。'}
  ];
  const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  // 九宮版本：依九位循環，方位轉為後天八卦宮位。
  const PALACES9 = [
    {name:'大安',element:'木',palace:'震宮',direction:'東',hint:'安定・守成',desc:'主穩定、守成與按部就班。'},
    {name:'留連',element:'木',palace:'巽宮',direction:'東南',hint:'遲滯・牽纏',desc:'主延遲、反覆與牽連。'},
    {name:'速喜',element:'火',palace:'離宮',direction:'南',hint:'迅速・喜訊',desc:'主快速進展、消息與喜慶。'},
    {name:'赤口',element:'金',palace:'兌宮',direction:'西',hint:'口舌・爭端',desc:'主口舌、衝突與風險。'},
    {name:'小吉',element:'水',palace:'坎宮',direction:'北',hint:'助力・漸進',desc:'主小成、助力與漸進。'},
    {name:'空亡',element:'土',palace:'中宮',direction:'中央',hint:'落空・變數',desc:'主不確定、落空與虛耗。'},
    {name:'病符',element:'土',palace:'坤宮',direction:'西南',hint:'病耗・隱患',desc:'主耗損、阻滯與需要處理的隱患。'},
    {name:'桃花',element:'土',palace:'艮宮',direction:'東北',hint:'人緣・牽動',desc:'主人際、情感與關係牽動。'},
    {name:'天德',element:'金',palace:'乾宮',direction:'西北',hint:'貴人・化解',desc:'主貴人、長輩助力與化解。'}
  ];
  const $ = id => document.getElementById(id);
  let currentResult = null;
  let displayMode = 'simple';

  function updateHeaderClock(){
    const now=new Date();
    const parts=new Intl.DateTimeFormat('en-CA',{
      timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',
      hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
    }).formatToParts(now);
    const v=Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
    $('liveDate').textContent='陽曆：'+v.year+'年'+v.month+'月'+v.day+'日 '+v.hour+':'+String(v.minute).padStart(2,'0');
    try{
      const lunar=Solar.fromYmdHms(v.year,v.month,v.day,v.hour,v.minute,v.second).getLunar();
      const lunarMonth=Math.abs(lunar.getMonth());
      const leap=lunar.getMonth()<0?'閏':'';
      const hourIndex=hourIndexFromClock(v.hour);
      $('liveLunar').textContent='農曆：'+lunar.getYear()+'年'+leap+lunarMonth+'月'+lunar.getDay()+'日 '+BRANCHES[hourIndex]+'時';
    }catch(error){
      $('liveLunar').textContent='農曆：日期換算中';
      console.error(error);
    }
  }

  function fillSelects(){
    const month = $('monthSelect'), day = $('daySelect'), hour = $('hourSelect');
    month.innerHTML = '<option value="">選月</option>';
    for(let i=1;i<=12;i++) month.add(new Option(i+' 月',String(i)));
    day.innerHTML = '<option value="">選日</option>';
    for(let i=1;i<=30;i++) day.add(new Option(i+' 日',String(i)));
    hour.innerHTML = '<option value="">選時辰</option>';
    BRANCHES.forEach((b,i)=>hour.add(new Option(b+'時',String(i))));
  }

  function palaceIndex(month, day, hourIndex){
    const monthStep = (month - 1) % 6;
    const dayStep = (monthStep + day - 1) % 6;
    const hourStep = (dayStep + hourIndex) % 6;
    return {monthStep,dayStep,hourStep};
  }

  function palaceIndex9(month, day, hourIndex){
    const advance=(start,count)=>(start+count-1)%9;
    const monthStep=advance(0,month);
    const dayStep=advance(monthStep,day);
    const hourStep=advance(dayStep,hourIndex+1);
    return {monthStep,dayStep,hourStep};
  }

  function hourIndexFromClock(hour){
    return Math.floor(((hour + 1) % 24) / 2);
  }

  function runCast(data){
    const steps = displayMode==='full'
      ? palaceIndex9(data.month,data.day,data.hourIndex)
      : palaceIndex(data.month,data.day,data.hourIndex);
    const list=displayMode==='full'?PALACES9:PALACES;
    currentResult = {
      ...data,
      mode:displayMode,
      steps,
      resultIndex:steps.hourStep,
      result:list[steps.hourStep],
      createdAt:data.createdAt||new Date().toISOString()
    };
    renderResult();
  }

  function renderResult(){
    if(!currentResult) return;
    const r=currentResult, p=r.result;
    const area=$('resultArea');
    const simpleMode=displayMode==='simple';
    const list=simpleMode?PALACES:PALACES9;
    const simpleLayout=[1,2,3,0,4,5];
    const palaceHtml=simpleLayout.map(index=>{
      const item=PALACES[index];
      const category=[0,2,4].includes(index)?'三吉':'三凶';
      return '<div class="palace palace-slot '+(index===r.resultIndex?'active':'')+'"><div class="palace-name">'+item.name+'</div><div class="palace-meaning">'+category+'</div></div>';
    }).join('');
    const common=simpleMode
      ? '<div class="result-top"><div class="result-kicker">傳統六宮掌訣 · 時宮結果</div><div class="result-name">'+p.name+'</div><div class="result-tagline">'+([0,2,4].includes(r.resultIndex)?'三吉':'三凶')+'</div></div><div class="palace-grid">'+palaceHtml+'</div>'
      : '<div class="result-top"><div class="result-kicker">九宮三傳 · 末傳結果</div><div class="result-name">'+p.name+'</div><div class="result-tagline">'+p.hint+' · '+p.element+' · '+p.palace+'</div></div>';
    const stageLabels=simpleMode?['月宮','日宮','時宮']:['初傳','中傳','末傳'];
    const stageRoles=simpleMode?['月起','日起','時落']:['初傳','中傳','末傳'];
    const stageInputs=simpleMode
      ? ['農曆 '+r.month+' 月','農曆 '+r.day+' 日',BRANCHES[r.hourIndex]+'時']
      : ['農曆月數 '+r.month,'農曆日數 '+r.day,'時辰序數 '+(r.hourIndex+1)];
    const stageCards=[
      {label:stageLabels[0],role:stageRoles[0],phase:'start',input:stageInputs[0],item:list[r.steps.monthStep]},
      {label:stageLabels[1],role:stageRoles[1],phase:'middle',input:stageInputs[1],item:list[r.steps.dayStep]},
      {label:stageLabels[2],role:stageRoles[2],phase:'end',input:stageInputs[2],item:list[r.steps.hourStep]}
    ];
    const stages='<div class="stage-grid">'+stageCards.map((step,i)=>
      '<div class="stage-card phase-'+step.phase+' '+(i===2?'final':'')+'"><div class="stage-rail"><div class="stage-role">'+step.role+'</div></div><div class="stage-content"><div class="stage-label">'+step.label+'</div><div class="stage-name">'+step.item.name+'</div><div class="stage-input">'+step.input+'</div></div></div>'
    ).join('')+'</div>';
    const category=[0,2,4].includes(r.resultIndex)?'三吉':'三凶';
    const interpretation=simpleMode
      ? '<div class="explain"><div class="explain-title">古籍所載：'+category+'</div><div class="explain-text">清代《西齋雜著二種・鳳城瑣錄》〈六壬口訣〉記載六課陰陽消長。此處只呈現吉凶分類；各宮細部斷語及五行配屬仍待逐條核對文獻。</div></div>'
      : '<div class="explain"><div class="explain-title">'+p.name+' · '+p.hint+'</div><div class="explain-text">'+p.desc+' 九宮擴充系統獨立運算，不套用六宮的判斷規則。</div></div>';
    const meta='<div class="time-stamp">'+(simpleMode?'六宮掌訣':'九宮三傳')+' · 農曆 '+r.monthLabel+' '+r.day+' 日 · '+BRANCHES[r.hourIndex]+'時'+(r.timeLabel?' · '+r.timeLabel:'')+'</div>';
    area.className='';
    area.innerHTML=common+interpretation+stages+meta+
      '<div class="result-actions"><button class="secondary-btn" id="saveRecord" type="button">保存這一卦</button><button class="secondary-btn" id="resetResult" type="button">清除結果</button></div>';
    $('saveRecord').addEventListener('click',saveRecord);
    $('resetResult').addEventListener('click',resetResult);
  }

  function setMode(mode){
    displayMode=mode;
    document.querySelectorAll('[data-mode]').forEach(btn=>btn.classList.toggle('active',btn.dataset.mode===mode));
    $('modeDescription').textContent=mode==='full'
      ? '九宮三傳：月定初傳、日定中傳、時定末傳；獨立於六宮運算。'
      : '六宮掌訣：月起、日起、時落；不套用九宮配置。';
    if(currentResult) runCast({...currentResult});
  }

  function getRecords(){
    try{return JSON.parse(localStorage.getItem('sixflow.records')||'[]');}
    catch(e){return [];}
  }
  function saveRecord(){
    if(!currentResult)return;
    const records=getRecords();
    const r=currentResult;
    records.unshift({
      id:Date.now(),
      question:$('question').value.trim(),
      month:r.month,day:r.day,hourIndex:r.hourIndex,
      palace:r.result.name,mode:r.mode||displayMode,
      chain:r.steps?[
        (r.mode==='full'?PALACES9:PALACES)[r.steps.monthStep].name,
        (r.mode==='full'?PALACES9:PALACES)[r.steps.dayStep].name,
        (r.mode==='full'?PALACES9:PALACES)[r.steps.hourStep].name
      ]:[],
      createdAt:r.createdAt,timeLabel:r.timeLabel||'手動輸入'
    });
    try{localStorage.setItem('sixflow.records',JSON.stringify(records.slice(0,50)));renderRecords();}
    catch(e){alert('此瀏覽器無法保存紀錄，請檢查儲存空間或瀏覽器設定。');}
  }
  function renderRecords(){
    const records=getRecords(), root=$('records');
    if(!records.length){root.innerHTML='<div class="records-empty">還沒有紀錄。<br>起卦後可將結果保存，日後回來驗證。</div>';return;}
    root.innerHTML=records.map(r=>
      '<div class="record"><div class="record-head"><div class="record-question">'+escapeHtml(r.question||'未填寫問事')+'</div><div class="record-result">'+r.palace+'</div></div>'+
      '<div class="record-meta">'+(r.mode==='full'?'九宮三傳':'六宮掌訣')+' · '+escapeHtml(r.timeLabel||'')+' · 農曆 '+r.month+'月'+r.day+'日 · '+BRANCHES[r.hourIndex]+'時'+(r.chain&&r.chain.length?' · '+r.chain.join(' → '):'')+'</div>'+
      '<div class="record-head"><span class="record-meta">'+new Date(r.createdAt).toLocaleString('zh-TW',{hour12:false})+'</span><button class="record-delete" type="button" data-delete="'+r.id+'">刪除</button></div></div>'
    ).join('');
    root.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>{
      const next=getRecords().filter(x=>String(x.id)!==btn.dataset.delete);
      localStorage.setItem('sixflow.records',JSON.stringify(next));renderRecords();
    }));
  }
  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  }
  function resetResult(){
    currentResult=null;
    $('resultArea').className='result-empty';
    $('resultArea').textContent='尚未起卦。取得目前時間，或自行輸入農曆月、日與時辰。';
    $('timeStamp').textContent='尚未取得時間 · GMT+8';
  }

  function autoCast(){
    try{
      const now=new Date();
      const parts=new Intl.DateTimeFormat('en-CA',{
        timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',
        hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'
      }).formatToParts(now);
      const values=Object.fromEntries(parts.filter(p=>p.type!=='literal').map(p=>[p.type,Number(p.value)]));
      const solar=Solar.fromYmdHms(values.year,values.month,values.day,values.hour,values.minute,values.second);
      const lunar=solar.getLunar();
      const rawMonth=lunar.getMonth();
      const month=Math.abs(rawMonth);
      const day=lunar.getDay();
      const h=values.hour;
      const hourIndex=hourIndexFromClock(h);
      const stamp=new Intl.DateTimeFormat('zh-TW',{
        timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',
        hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false
      }).format(now);
      $('monthSelect').value=String(month);
      $('daySelect').value=String(day);
      $('hourSelect').value=String(hourIndex);
      const monthLabel=lunar.getMonthInChinese();
      $('timeStamp').textContent='已取得 '+stamp+' · GMT+8'+(rawMonth<0?' · 閏月':'');
      runCast({month,day,hourIndex,monthLabel,timeLabel:stamp,source:'auto'});
    }catch(error){
      const panel=$('customTimePanel');
      panel.hidden=false;
      $('customToggle').setAttribute('aria-expanded','true');
      $('timeStamp').textContent='自動換算暫時無法使用，請手動選擇農曆月、日與時辰。';
      $('resultArea').className='result-empty';
      $('resultArea').textContent='請在上方選擇農曆月、日與時辰，再按「以自訂時間起卦」。';
      console.error('自動陽曆轉農曆失敗：',error);
      panel.scrollIntoView({behavior:'smooth',block:'nearest'});
    }
  }

  function manualCast(){
    const month=Number($('monthSelect').value),day=Number($('daySelect').value),hourIndex=Number($('hourSelect').value);
    if(!month||!day||$('hourSelect').value===''){
      alert('請完整選擇農曆月、日與時辰。');return;
    }
    runCast({month,day,hourIndex,monthLabel:'農曆'+month+'月',timeLabel:'手動輸入',source:'manual'});
    $('timeStamp').textContent='手動輸入 · 農曆 '+month+'月'+day+'日 · '+BRANCHES[hourIndex]+'時';
  }

  $('autoCast').addEventListener('click',autoCast);
  $('manualCast').addEventListener('click',manualCast);
  $('customToggle').addEventListener('click',()=>{
    const panel=$('customTimePanel');
    const opening=panel.hidden;
    panel.hidden=!opening;
    $('customToggle').setAttribute('aria-expanded',String(opening));
  });
  $('question').addEventListener('input',()=> $('charCount').textContent=$('question').value.length);
  document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>setMode(btn.dataset.mode)));

  $('themeBtn').addEventListener('click',()=>{
    document.body.classList.toggle('light');
    try{localStorage.setItem('theme',document.body.classList.contains('light')?'light':'dark');}catch(e){}
  });
  try{if(localStorage.getItem('theme')==='light')document.body.classList.add('light');}catch(e){}
  updateHeaderClock();
  setInterval(updateHeaderClock,1000);
  fillSelects();
  renderRecords();
})();
</script>
</body>
</html>
