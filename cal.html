<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>干支月曆</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --bg:#0f0e0c;--bg2:#1a1814;--gold:#d4a75b;--gold2:rgba(212,167,91,.15);
  --gold3:rgba(212,167,91,.35);--text:#c8a96e;--dim:rgba(212,167,91,.45);
  --green:#7aab8a;--red:#c06060;--border:rgba(212,167,91,.18);--trans:all 0.2s ease;
}
body.light{
  --bg:#f5eedc;--bg2:#ede4cc;--gold:#7a5020;--gold2:rgba(122,80,32,.1);
  --gold3:rgba(122,80,32,.3);--text:#6b4010;--dim:rgba(122,80,32,.5);
  --green:#3d7a52;--red:#9a3030;--border:rgba(122,80,32,.2);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--gold);font-family:"PingFang TC","Microsoft JhengHei",sans-serif;}
body{display:flex;flex-direction:column;}

/* Header */
.header{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:env(safe-area-inset-top,10px) 12px 10px;background:var(--bg);border-bottom:1px solid var(--border);}
.title-area{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:4px 0;user-select:none;-webkit-user-select:none;}
.title-area.pressed{opacity:.7;}
.main-title{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.5px;white-space:nowrap;cursor:pointer;}
.ganzhi-year{font-size:13px;color:var(--gold);margin-top:3px;letter-spacing:1.5px;font-weight:700;white-space:nowrap;cursor:pointer;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mode-btn{padding:5px 12px;font-size:12px;border-radius:20px;border:1px solid var(--gold3);background:transparent;color:var(--text);cursor:pointer;transition:var(--trans);white-space:nowrap;}
.mode-btn.active{background:var(--gold2);color:var(--gold);border-color:var(--gold);}
.menu-btn,.theme-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold3);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.menu-btn{font-size:18px;line-height:1;}

/* Weekday */
.weekday-row{flex-shrink:0;display:grid;grid-template-columns:repeat(7,1fr);padding:6px 4px 4px;border-bottom:1px solid var(--border);}
.weekday-row span{text-align:center;font-size:11px;color:var(--dim);font-weight:500;}
.weekday-row span:first-child{color:var(--red);}

/* Viewport */
.cal-viewport{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;}

/* Grid */
.cal-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);padding:3px;gap:3px;background:var(--border);}

/* Cells */
.day-cell{
  position:relative;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:6px;cursor:pointer;border:none;
  padding:1px 1px 2px;overflow:hidden;background:var(--bg);
  transition:background .12s;
  user-select:none;-webkit-user-select:none;
}
.day-cell:active{background:var(--gold2);}
.day-cell.other-month{opacity:.28;}
.day-cell.today{background:var(--gold2);box-shadow:inset 0 0 0 2px var(--green);}
.day-cell.today .day-num{color:var(--gold);font-weight:800;}
body.light .day-cell.today{box-shadow:inset 0 0 0 2px var(--red);}
.day-cell.selected{background:var(--bg);box-shadow:inset 0 0 0 2px var(--gold);}

/* 格頂雙標籤（干支月 + 農曆月） */
.cell-top{
  display:flex;justify-content:center;align-items:center;gap:2px;
  width:100%;min-height:14px;margin-bottom:1px;
}
.gz-month-tag{
  font-size:clamp(8px,2.1vw,11px);
  color:var(--gold);font-weight:700;
  letter-spacing:.3px;line-height:1;
  white-space:nowrap;
}
.lm-month-tag{
  font-size:clamp(8px,2.1vw,11px);
  color:var(--dim);font-weight:600;
  letter-spacing:.3px;line-height:1;
  white-space:nowrap;
}
/* 只有其中一個時置中 */
.cell-top.single .gz-month-tag,
.cell-top.single .lm-month-tag{
  font-size:clamp(9px,2.3vw,12px);
}

/* 節氣標在底部 */
.jq-label{
  position:absolute;bottom:2px;left:0;right:0;
  text-align:center;font-size:clamp(9px,2.4vw,12px);
  color:var(--green);font-weight:700;line-height:1;
}
.day-num{
  font-size:clamp(15px,4.4vw,24px);font-weight:600;
  color:var(--text);line-height:1.05;
}
.day-sub{
  font-size:clamp(11px,3.2vw,16px);color:var(--text);
  line-height:1;margin-top:3px;font-weight:700;
}
.note-dot{position:absolute;bottom:2px;right:3px;font-size:7px;color:var(--gold);}

/* Safe area */
.safe-bottom{flex-shrink:0;height:env(safe-area-inset-bottom,0px);background:var(--bg);}

/* Bubble */
.note-bubble{display:none;position:fixed;z-index:200;max-width:180px;min-width:80px;background:var(--bg2);border:1px solid var(--gold3);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text);line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none;word-break:break-all;}
.note-bubble.bubble-above::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold3);border-bottom:none;}
.note-bubble.bubble-below::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--gold3);border-top:none;}

/* Copy toast */
.copy-toast{
  display:none;position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.88);
  z-index:500;background:var(--bg2);border:1px solid var(--gold3);
  border-radius:12px;padding:10px 20px;font-size:14px;
  color:var(--gold);pointer-events:none;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
  transition:opacity .25s,transform .25s;
  opacity:0;
}
.copy-toast.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1);}

/* Modals */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.note-modal,.io-modal,.jump-modal{background:var(--bg2);border:1px solid var(--gold3);border-radius:16px;padding:20px;width:min(320px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.5);}
.modal-title{font-size:15px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:16px;}
.modal-date{font-size:13px;color:var(--dim);margin-bottom:12px;text-align:center;line-height:1.5;}
#note-input{width:100%;min-height:80px;max-height:160px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.5;}
body.light #note-input{background:rgba(255,255,255,.5);}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btns button{flex:1;padding:10px 0;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:var(--trans);}
.modal-btns button:nth-child(1){background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;}
.modal-btns button:nth-child(2){background:transparent;color:var(--red);border-color:rgba(192,96,96,.4);}
.modal-btns button:nth-child(3){background:transparent;color:var(--dim);}
.modal-btns button:active{opacity:.7;transform:scale(.97);}
.io-btns{display:flex;flex-direction:column;gap:10px;}
.io-btn{padding:12px 0;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--gold3);background:var(--gold2);color:var(--text);font-family:inherit;transition:var(--trans);text-align:center;}
.io-btn:active{opacity:.7;}
.io-close{margin-top:12px;padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;width:100%;}

/* Jump modal */
.jump-row{display:flex;gap:10px;margin-bottom:4px;}
.jump-row input,.jump-row select{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:15px;font-family:inherit;outline:none;text-align:center;}
body.light .jump-row input,body.light .jump-row select{background:rgba(255,255,255,.5);}
.jump-row select option{background:var(--bg2);color:var(--text);}
.jump-today{width:100%;margin-top:10px;padding:11px 0;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--gold3);background:var(--gold2);color:var(--gold);font-family:inherit;font-weight:600;}
.jump-today:active{opacity:.7;}
</style>
</head>
<body>

<div class="header">
  <div class="title-area" id="title-area">
    <div class="main-title" id="main-title"></div>
    <div class="ganzhi-year" id="ganzhi-year"></div>
  </div>
  <div class="header-right">
    <button class="mode-btn" id="mode-btn" onclick="toggleMode()">農曆</button>
    <button class="menu-btn" onclick="openIOModal()">⋮</button>
    <button class="theme-btn" onclick="toggleTheme()">◑</button>
  </div>
</div>

<div class="weekday-row"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>

<div class="cal-viewport" id="cal-viewport">
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="safe-bottom"></div>
<div class="note-bubble" id="note-bubble"></div>
<div class="copy-toast" id="copy-toast"></div>

<!-- 備註 Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="note-modal" onclick="event.stopPropagation()">
    <div class="modal-date" id="modal-date"></div>
    <textarea id="note-input" placeholder="新增備註…"></textarea>
    <div class="modal-btns">
      <button onclick="saveNote()">儲存</button>
      <button onclick="deleteNote()">刪除</button>
      <button onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<!-- 備註管理 Modal -->
<div class="modal-overlay" id="io-overlay" onclick="closeIOModal()">
  <div class="io-modal" onclick="event.stopPropagation()">
    <div class="modal-title">備註管理</div>
    <div class="io-btns">
      <button class="io-btn" onclick="exportNotes()">📤 匯出備註（JSON）</button>
      <button class="io-btn" onclick="document.getElementById('import-input').click()">📥 匯入備註（JSON）</button>
    </div>
    <button class="io-close" onclick="closeIOModal()">取消</button>
  </div>
</div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="importNotes(this)">

<!-- 跳轉 Modal -->
<div class="modal-overlay" id="jump-overlay" onclick="closeJumpModal()">
  <div class="jump-modal" onclick="event.stopPropagation()">
    <div class="modal-title">跳轉月份</div>
    <div class="jump-row">
      <input type="number" id="jump-year" min="1900" max="2100" placeholder="年">
      <select id="jump-month">
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>
    </div>
    <div class="modal-btns" style="margin-top:10px;">
      <button onclick="jumpToDate()">跳轉</button>
      <button onclick="closeJumpModal()" style="color:var(--dim)">取消</button>
    </div>
    <button class="jump-today" onclick="goToToday()">回到今天</button>
  </div>
</div>

<script>
// ── 常數 ──
const GAN_COLOR={'甲':'#7aab8a','乙':'#7aab8a','丙':'#c06060','丁':'#c06060','戊':'#d4a75b','己':'#d4a75b','庚':'#a0b8c8','辛':'#a0b8c8','壬':'#6a9ab8','癸':'#6a9ab8'};
const LM=['','正','二','三','四','五','六','七','八','九','十','冬','臘'];

const today=new Date();
let vy=today.getFullYear(), vm=today.getMonth()+1;
let mode='ganzhi', selectedKey=null, modalKey=null;
let isAnimating=false, swipeBlocked=false;

if(localStorage.getItem('theme')==='light') document.body.classList.add('light');

// ── 農曆輔助 ──
function lunarOf(dy,dm,dd){
  return Solar.fromYmd(dy,dm,dd).getLunar();
}

// ── 計算一格的「格頂標籤」──
// showGZ：是否顯示干支月；showLM：是否顯示農曆月
// 干支月：月柱與上一天不同 → 顯示
// 農曆月：農曆日=1 → 顯示
function getCellTopLabels(dy,dm,dd){
  const lunar = lunarOf(dy,dm,dd);
  const gz = lunar.getMonthInGanZhi();           // 當天月柱
  const lDay = lunar.getDay();
  const lMon = Math.abs(lunar.getMonth());
  const isLeap = lunar.getMonth()<0;

  // 干支月是否換月（與前一天比較）
  let gzLabel = null;
  const prev = new Date(dy,dm-1,dd-1);
  const pLunar = lunarOf(prev.getFullYear(), prev.getMonth()+1, prev.getDate());
  if(pLunar.getMonthInGanZhi() !== gz){
    gzLabel = gz; // 今天月柱與昨天不同 → 顯示
  }

  // 農曆月首日
  let lmLabel = null;
  if(lDay===1){
    lmLabel = (isLeap?'閏':'')+LM[lMon]+'月';
  }

  return {gzLabel, lmLabel};
}

// ── 渲染格子 ──
function renderGrid(container, y, m){
  container.innerHTML='';
  const firstDow=new Date(y,m-1,1).getDay();
  const daysInMonth=new Date(y,m,0).getDate();
  const total=Math.ceil((firstDow+daysInMonth)/7)*7;
  container.style.gridTemplateRows=`repeat(${total/7},1fr)`;

  for(let i=0;i<total;i++){
    const offset=i-firstDow;
    const date=new Date(y,m-1,1+offset);
    const dy=date.getFullYear(),dm=date.getMonth()+1,dd=date.getDate();
    const isOther=dm!==m;
    const isTdy=dy===today.getFullYear()&&dm===today.getMonth()+1&&dd===today.getDate();
    const key=`${dy}-${String(dm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const dow=date.getDay();
    const lunar=lunarOf(dy,dm,dd);
    const jq=lunar.getJieQi();

    const cell=document.createElement('div');
    cell.className='day-cell'+(isOther?' other-month':'')+(isTdy?' today':'')+(selectedKey===key?' selected':'');
    cell.dataset.date=key;

    // ── 格頂標籤區 ──
    const {gzLabel, lmLabel} = getCellTopLabels(dy,dm,dd);
    if(gzLabel||lmLabel){
      const topDiv=document.createElement('div');
      const hasOne = (gzLabel?1:0)+(lmLabel?1:0)===1;
      topDiv.className='cell-top'+(hasOne?' single':'');
      if(gzLabel){
        const gz=document.createElement('span');
        gz.className='gz-month-tag';
        gz.textContent=gzLabel;
        topDiv.appendChild(gz);
      }
      if(lmLabel){
        const lm=document.createElement('span');
        lm.className='lm-month-tag';
        lm.textContent=lmLabel;
        topDiv.appendChild(lm);
      }
      cell.appendChild(topDiv);
    } else {
      // 佔位，保持格子高度一致
      const topDiv=document.createElement('div');
      topDiv.className='cell-top';
      cell.appendChild(topDiv);
    }

    // ── 節氣（底部）──
    if(jq){
      const el=document.createElement('span');
      el.className='jq-label';
      el.textContent=jq;
      cell.appendChild(el);
    }

    // ── 國曆日 ──
    const numEl=document.createElement('span');
    numEl.className='day-num';
    numEl.textContent=dd;
    if(dow===0) numEl.style.color='var(--red)';
    cell.appendChild(numEl);

    // ── 農曆日 / 干支日 ──
    const subEl=document.createElement('span');
    subEl.className='day-sub';
    if(mode==='lunar'){
      const ld=lunar.getDay(),lm2=Math.abs(lunar.getMonth());
      subEl.textContent=ld===1?(lunar.getMonth()<0?'閏':'')+LM[lm2]+'月':lunar.getDayInChinese();
    } else {
      const gz=lunar.getDayInGanZhi();
      subEl.textContent=gz;
      subEl.style.color=GAN_COLOR[gz[0]]||'var(--dim)';
    }
    cell.appendChild(subEl);

    if(localStorage.getItem('cal_note_'+key)){
      const dot=document.createElement('span');dot.className='note-dot';dot.textContent='●';cell.appendChild(dot);
    }

    // ── 事件 ──
    attachCellEvents(cell, key, dy, dm, dd, lunar);
    container.appendChild(cell);
  }
}

// ── 格子事件（長按開備註，點擊選取）──
function attachCellEvents(cell, key, dy, dm, dd, lunar){
  let pressTimer=null;
  let moved=false;
  let startX=0, startY=0;

  cell.addEventListener('pointerdown', e=>{
    if(swipeBlocked||isDragging) return;
    moved=false;
    startX=e.clientX; startY=e.clientY;
    pressTimer=setTimeout(()=>{
      pressTimer=null;
      if(!moved&&!isDragging&&!swipeBlocked){
        openModal(key,dy,dm,dd,lunar);
      }
    },480);
  });

  cell.addEventListener('pointermove', e=>{
    if(Math.abs(e.clientX-startX)>8||Math.abs(e.clientY-startY)>8){
      moved=true;
      if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    }
  });

  const cancelPress=()=>{
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  };
  cell.addEventListener('pointerup', cancelPress);
  cell.addEventListener('pointercancel', cancelPress);

  cell.addEventListener('click', ()=>{
    if(swipeBlocked||moved) return;
    handleClick(key,cell);
  });
}

// ── Header ──
function updateHeader(){
  document.getElementById('main-title').textContent=`${vy}年 ${vm}月`;
  const mid=Solar.fromYmd(vy,vm,15).getLunar();
  document.getElementById('ganzhi-year').textContent=mid.getYearInGanZhiByLiChun()+'年';
  const btn=document.getElementById('mode-btn');
  if(mode==='ganzhi'){btn.textContent='干支';btn.classList.add('active');}
  else{btn.textContent='農曆';btn.classList.remove('active');}
}

function render(){
  updateHeader();
  hideBubble();
  renderGrid(document.getElementById('cal-grid'),vy,vm);
}

// ── 月份切換動畫（含滑動完成動畫）──
function calcAdjacentMonth(delta){
  let ay=vy,am=vm+delta;
  if(am>12){am=1;ay++;}
  if(am<1){am=12;ay--;}
  return {ay,am};
}

function changeMonth(delta){
  if(isAnimating) return;
  isAnimating=true;
  swipeBlocked=true;
  selectedKey=null;
  hideBubble();

  const viewport=document.getElementById('cal-viewport');
  const oldGrid=document.getElementById('cal-grid');
  const {ay,am}=calcAdjacentMonth(delta);
  vy=ay; vm=am;

  const newGrid=document.createElement('div');
  newGrid.className='cal-grid';
  newGrid.style.cssText=`position:absolute;inset:0;transition:none;transform:translateY(${delta>0?'100%':'-100%'})`;
  renderGrid(newGrid,vy,vm);
  viewport.appendChild(newGrid);
  oldGrid.style.cssText='position:absolute;inset:0;';

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const t='transform 0.34s cubic-bezier(0.25,0.46,0.45,0.94)';
    newGrid.style.transition=t;
    oldGrid.style.transition=t;
    newGrid.style.transform='translateY(0)';
    oldGrid.style.transform=`translateY(${delta>0?'-100%':'100%'})`;
    setTimeout(()=>{
      oldGrid.remove();
      newGrid.id='cal-grid';
      newGrid.style.cssText='';
      updateHeader();
      isAnimating=false;
      setTimeout(()=>swipeBlocked=false,40);
    },350);
  }));
}

// ── 拖動換月（即時跟手，流暢版）──
const viewport=document.getElementById('cal-viewport');
let dragStartX=0, dragStartY=0;
let dragPending=false, isDragging=false;
let dragDir=0, adjGrid=null, adjVy=0, adjVm=0;
let lastPointerY=0;

viewport.addEventListener('pointerdown', e=>{
  if(isAnimating) return;
  dragPending=true;
  dragStartX=e.clientX;
  dragStartY=e.clientY;
  lastPointerY=e.clientY;
  isDragging=false;
  dragDir=0;
  viewport.setPointerCapture(e.pointerId);
}, {passive:true});

window.addEventListener('pointermove', e=>{
  if(!dragPending||isAnimating) return;
  const dy=e.clientY-dragStartY;
  const dx=e.clientX-dragStartX;
  lastPointerY=e.clientY;

  // 確定是垂直拖動（超過 10px 且垂直分量>水平1.2倍）
  if(!isDragging&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*1.2){
    isDragging=true;
    dragPending=false;
    dragDir=dy<0?1:-1;

    const adj=calcAdjacentMonth(dragDir);
    adjVy=adj.ay; adjVm=adj.am;

    // 準備鄰月格子
    adjGrid=document.createElement('div');
    adjGrid.className='cal-grid';
    adjGrid.style.cssText=`position:absolute;inset:0;transform:translateY(${dragDir>0?'100%':'-100%'})`;
    renderGrid(adjGrid,adjVy,adjVm);
    viewport.appendChild(adjGrid);

    // 當前格子固定
    const cur=document.getElementById('cal-grid');
    if(cur) cur.style.cssText='position:absolute;inset:0;';
  }

  if(isDragging){
    const curDy=e.clientY-dragStartY;
    const cur=document.getElementById('cal-grid');
    const adjStart=dragDir>0?viewport.offsetHeight:-viewport.offsetHeight;
    if(cur) cur.style.transform=`translateY(${curDy}px)`;
    if(adjGrid) adjGrid.style.transform=`translateY(${adjStart+curDy}px)`;
  }
}, {passive:true});

function endDrag(e){
  if(!dragPending&&!isDragging) return;
  dragPending=false;
  if(!isDragging) return;
  isDragging=false;

  const totalDy=(e.clientY??lastPointerY)-dragStartY;
  // 門檻：超過 22% 高度即切換（比原本 28% 更靈敏）
  const threshold=viewport.offsetHeight*0.22;

  swipeBlocked=true;
  setTimeout(()=>swipeBlocked=false,80);

  if(Math.abs(totalDy)>threshold){
    completeSlide(dragDir);
  } else {
    snapBack();
  }
}

window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', e=>{
  dragPending=false;
  if(!isDragging) return;
  isDragging=false;
  snapBack();
});

function completeSlide(dir){
  isAnimating=true;
  vy=adjVy; vm=adjVm;
  const cur=document.getElementById('cal-grid');
  const t='transform 0.26s cubic-bezier(0.25,0.46,0.45,0.94)';
  if(cur){ cur.style.transition=t; cur.style.transform=`translateY(${dir>0?'-100%':'100%'})`; }
  if(adjGrid){ adjGrid.style.transition=t; adjGrid.style.transform='translateY(0)'; }
  setTimeout(()=>{
    if(cur) cur.remove();
    if(adjGrid){
      adjGrid.id='cal-grid';
      adjGrid.style.cssText='';
      adjGrid=null;
    }
    selectedKey=null;
    updateHeader();
    isAnimating=false;
  },270);
}

function snapBack(){
  const cur=document.getElementById('cal-grid');
  const t='transform 0.22s cubic-bezier(0.25,0.46,0.45,0.94)';
  if(cur){ cur.style.transition=t; cur.style.transform='translateY(0)'; }
  if(adjGrid){ adjGrid.style.transition=t; adjGrid.style.transform=`translateY(${dragDir>0?'100%':'-100%'})`; }
  setTimeout(()=>{
    if(cur) cur.removeAttribute('style');
    if(adjGrid){ adjGrid.remove(); adjGrid=null; }
  },230);
}

// ── 滾輪 ──
let lastWheel=0;
viewport.addEventListener('wheel', e=>{
  e.preventDefault();
  const now=Date.now();
  if(isAnimating||now-lastWheel<380) return;
  lastWheel=now;
  changeMonth(e.deltaY>0?1:-1);
},{passive:false});

// ── Header 長按複製 ──
(()=>{
  const area=document.getElementById('title-area');
  let hTimer=null;

  function startPress(e){
    hTimer=setTimeout(()=>{
      hTimer=null;
      const text=document.getElementById('ganzhi-year').textContent;
      copyText(text,'已複製：'+text);
    },500);
  }
  function cancelPress(){
    if(hTimer){clearTimeout(hTimer);hTimer=null;}
  }

  area.addEventListener('pointerdown', startPress);
  area.addEventListener('pointerup', e=>{
    if(hTimer){ cancelPress(); openJumpModal(); }
  });
  area.addEventListener('pointercancel', cancelPress);
  area.addEventListener('pointermove', cancelPress);
})();

// ── 複製工具 ──
function copyText(text, toast){
  navigator.clipboard.writeText(text).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
  });
  showToast(toast||'已複製');
}
function showToast(msg){
  const t=document.getElementById('copy-toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1600);
}

// ── 點擊與泡泡 ──
function handleClick(key,el){
  hideBubble();
  document.querySelectorAll('.day-cell.selected').forEach(c=>c.classList.remove('selected'));
  if(selectedKey===key){ selectedKey=null; return; }
  selectedKey=key; el.classList.add('selected');
  const note=localStorage.getItem('cal_note_'+key);
  if(note) showBubble(el,note);
}

function showBubble(el,text){
  const b=document.getElementById('note-bubble');
  b.textContent=text; b.style.display='block';
  const r=el.getBoundingClientRect();
  const bh=b.offsetHeight||50;
  const above=r.top>bh+16;
  b.className='note-bubble '+(above?'bubble-above':'bubble-below');
  b.style.top=above?(r.top-bh-8)+'px':(r.bottom+8)+'px';
  b.style.left=Math.max(6,Math.min(window.innerWidth-186,r.left+r.width/2-90))+'px';
}
function hideBubble(){ document.getElementById('note-bubble').style.display='none'; }

// ── 備註 Modal ──
function openModal(key,y,m,d,lunar){
  modalKey=key; hideBubble();
  const gz=lunar.getDayInGanZhi();
  document.getElementById('modal-date').textContent=`${y}年${m}月${d}日　${LM[Math.abs(lunar.getMonth())]}月${lunar.getDayInChinese()}　${gz}`;
  document.getElementById('note-input').value=localStorage.getItem('cal_note_'+key)||'';
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(()=>document.getElementById('note-input').focus(),100);
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); modalKey=null; }
function saveNote(){ const v=document.getElementById('note-input').value.trim(); if(v) localStorage.setItem('cal_note_'+modalKey,v); else localStorage.removeItem('cal_note_'+modalKey); closeModal(); render(); }
function deleteNote(){ localStorage.removeItem('cal_note_'+modalKey); closeModal(); render(); }

// ── 跳轉 Modal ──
function openJumpModal(){
  document.getElementById('jump-year').value=vy;
  document.getElementById('jump-month').value=vm;
  document.getElementById('jump-overlay').classList.add('open');
}
function closeJumpModal(){ document.getElementById('jump-overlay').classList.remove('open'); }
function jumpToDate(){
  const y=parseInt(document.getElementById('jump-year').value);
  const m=parseInt(document.getElementById('jump-month').value);
  if(y>=1900&&y<=2100&&m>=1&&m<=12){
    vy=y; vm=m; closeJumpModal(); selectedKey=null;
    updateHeader(); hideBubble();
    renderGrid(document.getElementById('cal-grid'),vy,vm);
  }
}
function goToToday(){
  vy=today.getFullYear(); vm=today.getMonth()+1;
  selectedKey=null; closeJumpModal();
  updateHeader(); hideBubble();
  renderGrid(document.getElementById('cal-grid'),vy,vm);
}

// ── IO Modal ──
function openIOModal(){ document.getElementById('io-overlay').classList.add('open'); }
function closeIOModal(){ document.getElementById('io-overlay').classList.remove('open'); }
function exportNotes(){
  const notes={};
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('cal_note_')) notes[k.replace('cal_note_','')]=localStorage.getItem(k); }
  if(!Object.keys(notes).length){ alert('目前沒有任何備註'); return; }
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(notes,null,2)],{type:'application/json'}));
  a.download='干支曆備註_'+new Date().toISOString().slice(0,10)+'.json';
  a.click(); URL.revokeObjectURL(a.href); closeIOModal();
}
function importNotes(input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{ try{ const d=JSON.parse(e.target.result); let n=0; for(const[k,v] of Object.entries(d)) if(typeof v==='string'&&v.trim()){ localStorage.setItem('cal_note_'+k,v); n++; } input.value=''; closeIOModal(); render(); alert('已匯入 '+n+' 筆備註'); }catch{ alert('檔案格式錯誤'); } };
  r.readAsText(file);
}

// ── 主題 / 模式 ──
function toggleMode(){ mode=mode==='lunar'?'ganzhi':'lunar'; render(); }
function toggleTheme(){ const l=document.body.classList.toggle('light'); localStorage.setItem('theme',l?'light':'dark'); }

render();
</script>
