<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>干支月曆</title>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.7/lunar.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
:root{
  --bg:#0f0e0c;--bg2:#1a1814;--gold:#d4a75b;--gold2:rgba(212,167,91,.15);
  --gold3:rgba(212,167,91,.35);--text:#c8a96e;--dim:rgba(212,167,91,.45);
  --green:#7aab8a;--red:#c06060;--border:rgba(212,167,91,.18);--trans:all 0.2s ease;
}
body.light{
  --bg:#f5eedc;--bg2:#ede4cc;--gold:#7a5020;--gold2:rgba(122,80,32,.1);
  --gold3:rgba(122,80,32,.3);--text:#6b4010;--dim:rgba(122,80,32,.5);
  --green:#3d7a52;--red:#9a3030;--border:rgba(122,80,32,.2);
}
html{
  /* dvh = dynamic viewport height，自動扣除手機導覽列高度 */
  height:100dvh;
  min-height:-webkit-fill-available;
  overflow:hidden;
}
body{
  height:100dvh;
  min-height:-webkit-fill-available;
  overflow:hidden;
  background:var(--bg);color:var(--gold);
  font-family:"PingFang TC","Microsoft JhengHei",sans-serif;
  display:flex;flex-direction:column;
}

/* ── Header ── */
.header{
  flex-shrink:0;display:flex;align-items:center;gap:6px;
  padding:env(safe-area-inset-top,10px) 12px 10px;
  background:var(--bg);border-bottom:1px solid var(--border);
}
.title-area{
  flex:1;text-align:center;display:flex;flex-direction:column;
  align-items:center;justify-content:center;min-width:0;
  padding:4px 0;cursor:pointer;
  user-select:none;-webkit-user-select:none;
}
.title-area:active{opacity:.7;}
.main-title{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:.5px;white-space:nowrap;}
.ganzhi-year{font-size:13px;color:var(--gold);margin-top:3px;letter-spacing:1.5px;font-weight:700;white-space:nowrap;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.mode-btn{padding:5px 12px;font-size:12px;border-radius:20px;border:1px solid var(--gold3);background:transparent;color:var(--text);cursor:pointer;transition:var(--trans);white-space:nowrap;}
.mode-btn.active{background:var(--gold2);color:var(--gold);border-color:var(--gold);}
.menu-btn,.theme-btn{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold3);background:transparent;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;}
.menu-btn{font-size:18px;line-height:1;}
/* 月份切換三角按鈕 */
.month-nav-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--gold3);
  background:transparent;color:var(--gold);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;transition:var(--trans);
  user-select:none;-webkit-user-select:none;
}
.month-nav-btn:active{background:var(--gold2);transform:scale(.88);}

/* ── Weekday ── */
.weekday-row{
  flex-shrink:0;display:grid;grid-template-columns:repeat(7,1fr);
  padding:6px 4px 5px;border-bottom:1px solid var(--border);
}
/* [1] 星期列加強：用 --text 顏色 + 加粗 + 放大 */
.weekday-row span{
  text-align:center;font-size:13px;
  color:var(--text);font-weight:700;letter-spacing:.5px;
}
.weekday-row span:first-child{color:var(--red);}

/* 連續週列：使用瀏覽器原生捲動與慣性，不吸附月份。 */
.cal-viewport{
  flex:1;min-height:0;position:relative;touch-action:pan-y;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;
  overflow-anchor:none;scrollbar-width:none;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.cal-viewport::-webkit-scrollbar{display:none;}
.cal-grid{background:var(--border);padding:0 3px;}
.cal-week{
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  height:var(--week-height,100px);gap:3px;padding-bottom:3px;
}

/* ── Cells ── */
.day-cell{
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  border-radius:6px;cursor:pointer;border:none;
  padding:2px 2px 2px 2px;
  overflow:hidden;background:var(--bg);
  transition:background .12s;
  user-select:none;-webkit-user-select:none;
}
/* 中間橫排：左欄(數字+農曆) + 節氣膠囊，整體置中 */
.cell-mid{
  display:flex;flex-direction:row;
  align-items:center;justify-content:center;
  gap:4px;
}
/* 左欄：國曆數字 + 農曆/干支，垂直排 */
.cell-left{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:2px;
}
.day-cell:active{background:var(--gold2);}
.day-cell.other-month{opacity:.28;}
.day-cell.today{background:var(--gold2);box-shadow:inset 0 0 0 2px var(--green);}
.day-cell.today .day-num{color:var(--gold);font-weight:800;}
body.light .day-cell.today{box-shadow:inset 0 0 0 2px var(--red);}
.day-cell.selected{background:var(--bg);box-shadow:inset 0 0 0 2px var(--gold);}

/* ── 格頂標籤（絕對定位貼頂）── */
.cell-top{
  position:absolute;top:2px;left:0;right:0;
  display:flex;justify-content:center;align-items:center;
  gap:3px;line-height:1;pointer-events:none;
}
/* ── 格頂膠囊標籤 ── */
.gz-month-tag,.lm-month-tag{
  font-size:clamp(8px,2vw,10px);
  font-weight:700;letter-spacing:.3px;white-space:nowrap;
  padding:1px 5px;border-radius:20px;line-height:1.6;
}
.gz-month-tag{
  color:var(--gold);
  background:var(--gold2);
  border:1px solid var(--gold3);
}
.lm-month-tag{
  color:var(--gold);
  background:var(--gold2);
  border:1px solid var(--gold3);
}

/* ── 節氣：數字旁直向膠囊 ── */
.jq-label{
  display:flex;
  align-items:center;justify-content:center;
  flex-shrink:0;
  pointer-events:none;
}
.jq-inner{
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-size:clamp(10px,2.6vw,14px);
  color:var(--green);font-weight:700;line-height:1.35;
  padding:3px 2px;border-radius:20px;
  background:rgba(122,171,138,.15);
  border:1px solid rgba(122,171,138,.35);
  writing-mode:vertical-rl;
  text-orientation:upright;
  letter-spacing:1px;
  white-space:nowrap;
}
/* ── 國曆日 ── */
.day-num{
  font-size:clamp(15px,4.4vw,24px);font-weight:600;
  color:var(--text);line-height:1.05;
  user-select:text;-webkit-user-select:text;
}
/* ── 農/干支日 ── */
.day-sub{
  font-size:clamp(11px,3.1vw,15px);color:var(--text);
  line-height:1;margin-top:6px;font-weight:700;
  user-select:text;-webkit-user-select:text;
  /* 追蹤框的 outline 空間預留 */
  padding:2px 4px;border-radius:3px;
}
.note-dot{position:absolute;bottom:2px;right:2px;font-size:7px;color:var(--gold);pointer-events:none;}

/* [4] 電腦端（寬螢幕）所有小字放大 */
@media(min-width:600px){
  .gz-month-tag,.lm-month-tag{ font-size:12px; }
  .jq-inner{ font-size:15px; }
  .day-num{ font-size:clamp(18px,2.4vw,30px); }
  .day-sub{ font-size:clamp(13px,1.6vw,18px); }
  .weekday-row span{ font-size:14px; }
}

/* ── Bubble ── */
.note-bubble{display:none;position:fixed;z-index:200;max-width:180px;min-width:80px;background:var(--bg2);border:1px solid var(--gold3);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--text);line-height:1.4;box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none;word-break:break-all;}
.note-bubble.bubble-above::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--gold3);border-bottom:none;}
.note-bubble.bubble-below::after{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--gold3);border-top:none;}

/* ── Modals ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.note-modal,.io-modal,.jump-modal{background:var(--bg2);border:1px solid var(--gold3);border-radius:16px;padding:20px;width:min(320px,90vw);box-shadow:0 8px 32px rgba(0,0,0,.5);}
.modal-title{font-size:15px;font-weight:700;color:var(--gold);text-align:center;margin-bottom:16px;}
.modal-date{font-size:13px;color:var(--dim);margin-bottom:12px;text-align:center;line-height:1.5;}
#note-input{width:100%;min-height:80px;max-height:160px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--text);font-size:14px;font-family:inherit;resize:none;outline:none;line-height:1.5;}
body.light #note-input{background:rgba(255,255,255,.5);}
.modal-btns{display:flex;gap:8px;margin-top:14px;}
.modal-btns button{flex:1;padding:10px 0;border-radius:8px;font-size:14px;cursor:pointer;border:1px solid var(--border);font-family:inherit;transition:var(--trans);}
.modal-btns button:nth-child(1){background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:700;}
.modal-btns button:nth-child(2){background:transparent;color:var(--red);border-color:rgba(192,96,96,.4);}
.modal-btns button:nth-child(3){background:transparent;color:var(--dim);}
.modal-btns button:active{opacity:.7;transform:scale(.97);}
.io-btns{display:flex;flex-direction:column;gap:10px;}
.io-btn{padding:12px 0;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--gold3);background:var(--gold2);color:var(--text);font-family:inherit;transition:var(--trans);text-align:center;}
.io-btn:active{opacity:.7;}
.io-close{margin-top:12px;padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;width:100%;}
.jump-row{display:flex;gap:10px;margin-bottom:4px;}
.jump-row input,.jump-row select{flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text);font-size:15px;font-family:inherit;outline:none;text-align:center;}
body.light .jump-row input,body.light .jump-row select{background:rgba(255,255,255,.5);}
.jump-row select option{background:var(--bg2);color:var(--text);}
.jump-today{width:100%;margin-top:10px;padding:11px 0;border-radius:10px;font-size:14px;cursor:pointer;border:1px solid var(--gold3);background:var(--gold2);color:var(--gold);font-family:inherit;font-weight:600;}
.jump-today:active{opacity:.7;}

/* ── 干支追蹤 ── */
/* 追蹤的格子：外框高亮 */
.day-cell.gz-tracked .day-sub{
  outline:2px solid var(--gold);
  outline-offset:0;
}
/* 追蹤管理 modal */
.gz-modal{background:var(--bg2);border:1px solid var(--gold3);border-radius:16px;padding:20px;width:min(340px,92vw);box-shadow:0 8px 32px rgba(0,0,0,.5);max-height:88dvh;display:flex;flex-direction:column;overflow-y:auto;}
.gz-input-row{display:flex;gap:8px;margin-bottom:14px;}
.gz-input-row input{
  flex:1;padding:10px;border-radius:8px;border:1px solid var(--border);
  background:rgba(0,0,0,.3);color:var(--text);font-size:16px;
  font-family:inherit;outline:none;text-align:center;letter-spacing:3px;
}
body.light .gz-input-row input{background:rgba(255,255,255,.5);}
.gz-add-btn{
  padding:10px 16px;border-radius:8px;border:1px solid var(--gold3);
  background:var(--gold);color:var(--bg);font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap;
}
.gz-add-btn:active{opacity:.7;}
.gz-list{display:flex;flex-direction:column;gap:8px;}
.gz-tag{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-radius:10px;
  border:1px solid var(--gold3);background:var(--gold2);
}
.gz-tag-text{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:2px;}
.gz-tag-del{
  width:26px;height:26px;border-radius:50%;border:1px solid rgba(192,96,96,.4);
  background:transparent;color:var(--red);font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.gz-tag-del:active{opacity:.6;}
.gz-empty{text-align:center;color:var(--dim);font-size:13px;padding:20px 0;}
/* 列表內 inline 編輯 */
.tag-edit-input{
  background:rgba(0,0,0,.3);border:1px solid var(--gold3);border-radius:6px;
  color:var(--text);font-size:13px;font-family:inherit;outline:none;
  padding:3px 7px;width:100%;max-width:140px;
}
body.light .tag-edit-input{background:rgba(255,255,255,.5);}
.tag-edit-select{
  background:rgba(0,0,0,.3);border:1px solid var(--gold3);border-radius:6px;
  color:var(--text);font-size:12px;font-family:inherit;outline:none;
  padding:3px 4px;
}
body.light .tag-edit-select{background:rgba(255,255,255,.5);}

/* ── 農曆提醒 ── */
/* 所有提醒框統一金色 */
/* 農曆提醒框：框農曆日文字 */
.day-cell.lm-remind .day-sub{
  outline:2px solid var(--gold);
  outline-offset:0;
}
/* 國曆提醒框：框國曆數字 */
.day-cell.sol-remind .day-num{
  outline:2px solid var(--gold);
  outline-offset:2px;
  border-radius:3px;
}
/* 提醒文字共用樣式 */
.remind-label{
  font-size:clamp(9px,2vw,10px);
  color:var(--green);font-weight:600;
  line-height:1;margin-top:10px;
  text-align:center;
  max-width:90%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  pointer-events:none;
}
.sol-remind-label{
  font-size:clamp(9px,2vw,10px);
  color:var(--text);font-weight:600;
  line-height:1;margin-top:4px;
  text-align:center;
  max-width:90%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  pointer-events:none;
}
@media(min-width:600px){
  .remind-label,.sol-remind-label{ font-size:11px; }
}
/* Modal 內分隔線 */
.gz-section-title{
  font-size:12px;color:var(--dim);font-weight:600;
  letter-spacing:1px;padding:10px 0 6px;
  border-top:1px solid var(--border);margin-top:10px;
  text-align:center;
}
/* 農曆提醒輸入：兩行，與干支追蹤等寬對齊 */
.lm-input-block{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
/* 第一行：月選單 + 日選單 */
.lm-row1{display:flex;gap:8px;align-items:center;}
/* 第二行：標籤 + 加入按鈕 */
.lm-row2{display:flex;gap:8px;align-items:center;}
.lm-select{
  flex:1;padding:9px 8px;border-radius:8px;border:1px solid var(--border);
  background:rgba(0,0,0,.3);color:var(--text);font-size:14px;
  font-family:inherit;outline:none;text-align:center;cursor:pointer;
  -webkit-appearance:none;appearance:none;
}
body.light .lm-select{background:rgba(255,255,255,.5);}
.lm-select option{background:var(--bg2);color:var(--text);}
.lm-label-input{
  flex:1;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
  background:rgba(0,0,0,.3);color:var(--text);font-size:14px;
  font-family:inherit;outline:none;
}
body.light .lm-label-input{background:rgba(255,255,255,.5);}
.lm-sep{color:var(--dim);font-size:13px;flex-shrink:0;white-space:nowrap;}

/* ── 宜忌區塊 ── */
.yi-ji-block{
  margin-bottom:10px;border-radius:10px;
  border:1px solid var(--border);
  overflow:hidden;
}
.yi-row,.ji-row{
  display:flex;align-items:baseline;
  gap:6px;padding:7px 12px;
  font-size:13px;line-height:1.5;
}
.yi-row{background:rgba(122,171,138,.08);}
.ji-row{background:rgba(192,96,96,.07);}
.yi-label{color:var(--green);font-weight:700;flex-shrink:0;font-size:13px;}
.ji-label{color:var(--red);font-weight:700;flex-shrink:0;font-size:13px;}
.yi-text{color:var(--text);font-size:12px;flex:1;}
.ji-text{color:var(--text);font-size:12px;flex:1;}
</style>
</head>
<body>

<div class="header">
  <button class="month-nav-btn" onclick="changeMonth(-1)" title="上個月">▲</button>
  <div class="title-area" id="title-area" onclick="openJumpModal()">
    <div class="main-title" id="main-title"></div>
    <div class="ganzhi-year" id="ganzhi-year"></div>
  </div>
  <button class="month-nav-btn" onclick="changeMonth(1)" title="下個月">▼</button>
  <div class="header-right">
    <button class="mode-btn" id="mode-btn" onclick="toggleMode()">農曆</button>
    <button class="menu-btn" id="gz-track-btn" onclick="openGzModal()" title="干支追蹤">☯</button>
    <button class="menu-btn" onclick="openIOModal()">⋮</button>
    <button class="theme-btn" onclick="toggleTheme()">◑</button>
  </div>
</div>

<div class="weekday-row">
  <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
</div>

<div class="cal-viewport" id="cal-viewport">
  <div class="cal-grid" id="cal-grid"></div>
</div>

<div class="note-bubble" id="note-bubble"></div>

<!-- 備註 Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal()">
  <div class="note-modal" onclick="event.stopPropagation()">
    <div class="modal-date" id="modal-date"></div>
    <div class="yi-ji-block" id="yi-ji-block">
      <div class="yi-row">
        <span class="yi-label">宜</span>
        <span class="yi-text" id="yi-text"></span>
      </div>
      <div class="ji-row">
        <span class="ji-label">忌</span>
        <span class="ji-text" id="ji-text"></span>
      </div>
    </div>
    <textarea id="note-input" placeholder="新增備註…"></textarea>
    <div class="modal-btns">
      <button onclick="saveNote()">儲存</button>
      <button onclick="deleteNote()">刪除</button>
      <button onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<!-- 備註管理 Modal -->
<div class="modal-overlay" id="io-overlay" onclick="closeIOModal()">
  <div class="io-modal" onclick="event.stopPropagation()">
    <div class="modal-title">備註管理</div>
    <div class="io-btns">
      <button class="io-btn" onclick="exportNotes()">📤 匯出完整備份（JSON）</button>
      <button class="io-btn" onclick="document.getElementById('import-input').click()">📥 匯入備份（疊加合併）</button>
    </div>
    <button class="io-close" onclick="closeIOModal()">取消</button>
  </div>
</div>
<input type="file" id="import-input" accept=".json" style="display:none" onchange="importNotes(this)">

<!-- 干支追蹤 Modal -->
<div class="modal-overlay" id="gz-overlay" onclick="closeGzModal()">
  <div class="gz-modal" onclick="event.stopPropagation()">
    <div class="modal-title">干支追蹤</div>
    <div class="gz-input-row">
      <select id="gz-gan" class="lm-select">
        <option value="">天干</option>
        <option>甲</option><option>乙</option><option>丙</option><option>丁</option><option>戊</option>
        <option>己</option><option>庚</option><option>辛</option><option>壬</option><option>癸</option>
      </select>
      <select id="gz-zhi" class="lm-select">
        <option value="">地支</option>
        <option>子</option><option>丑</option><option>寅</option><option>卯</option><option>辰</option><option>巳</option>
        <option>午</option><option>未</option><option>申</option><option>酉</option><option>戌</option><option>亥</option>
      </select>
      <button class="gz-add-btn" onclick="addGzTrack()">追蹤</button>
    </div>
    <div class="gz-list" id="gz-list"></div>

    <!-- 農曆提醒區塊 -->
    <div class="gz-section-title">農曆重複提醒</div>
    <div class="lm-input-block">
      <div class="lm-row1">
        <select id="lm-mon" class="lm-select">

<script>
// ── 常數 ──
const GAN_COLOR={'甲':'#7aab8a','乙':'#7aab8a','丙':'#c06060','丁':'#c06060','戊':'#d4a75b','己':'#d4a75b','庚':'#a0b8c8','辛':'#a0b8c8','壬':'#6a9ab8','癸':'#6a9ab8'};
const LM=['','正','二','三','四','五','六','七','八','九','十','十一','十二'];

const today=new Date();
let vy=today.getFullYear(), vm=today.getMonth()+1;
let mode='ganzhi', selectedKey=null, modalKey=null;
let swipeBlocked=false;

// ── 干支追蹤 ──
let gzTracked=new Set(JSON.parse(localStorage.getItem('gz_tracked')||'[]'));
function saveGzTracked(){ localStorage.setItem('gz_tracked', JSON.stringify([...gzTracked])); }

// ── 農曆提醒 ──
// 資料格式：{ '8-15': { label:'媽媽生日', since:1980 }, '1-1': { label:'農曆新年', since:null } }
function loadLmReminds(){
  const raw=JSON.parse(localStorage.getItem('lm_reminds')||'{}');
  // 向下相容：舊格式 value 為字串
  const out={};
  for(const[k,v] of Object.entries(raw)){
    out[k]=typeof v==='string'?{label:v,since:null}:v;
  }
  return out;
}
let lmReminds=loadLmReminds();
function saveLmReminds(){ localStorage.setItem('lm_reminds', JSON.stringify(lmReminds)); }
// 取得某天的農曆提醒物件（月日匹配即觸發，不管閏月）
function getLmRemind(lunar){
  const m=Math.abs(lunar.getMonth());
  const d=lunar.getDay();
  return lmReminds[m+'-'+d]||null;
}

// ── 國曆提醒 ── key='M-D'，value={ label, since }
function loadSolReminds(){
  const raw=JSON.parse(localStorage.getItem('sol_reminds')||'{}');
  const out={};
  for(const[k,v] of Object.entries(raw)){
    out[k]=typeof v==='string'?{label:v,since:null}:v;
  }
  return out;
}
let solReminds=loadSolReminds();
function saveSolReminds(){ localStorage.setItem('sol_reminds', JSON.stringify(solReminds)); }
function getSolRemind(dm,dd){
  return solReminds[dm+'-'+dd]||null;
}

if(localStorage.getItem('theme')==='light') document.body.classList.add('light');

// ── 農曆輔助 ──
function lunarOf(dy,dm,dd){ return Solar.fromYmd(dy,dm,dd).getLunar(); }

// ── 格頂標籤計算 ──
// [3] 干支月：只在干支模式顯示（換月日）
// [2] 農曆月：只在農曆模式顯示（初一）；初一的下方格子顯示「初一」
function getCellTopLabels(dy,dm,dd){
  const lunar=lunarOf(dy,dm,dd);
  const gz=lunar.getMonthInGanZhi();
  const lDay=lunar.getDay();
  const lMon=Math.abs(lunar.getMonth());
  const isLeap=lunar.getMonth()<0;

  // [3] 干支月只在干支模式（換月才顯示）
  let gzLabel=null;
  if(mode==='ganzhi'){
    const prev=new Date(dy,dm-1,dd-1);
    const pLunar=lunarOf(prev.getFullYear(),prev.getMonth()+1,prev.getDate());
    if(pLunar.getMonthInGanZhi()!==gz) gzLabel=gz+'月';
  }

  // 農曆月（初一才標，只在農曆模式）
  let lmLabel=null;
  if(lDay===1&&mode==='lunar'){
    lmLabel=(isLeap?'閏':'')+LM[lMon]+'月';
  }

  return {gzLabel, lmLabel};
}

// ── 渲染格子 ──
function renderWeek(container, weekStart){
  container.innerHTML='';
  for(let i=0;i<7;i++){
    const date=addDays(weekStart,i);
    const dy=date.getFullYear(),dm=date.getMonth()+1,dd=date.getDate();
    const isTdy=dy===today.getFullYear()&&dm===today.getMonth()+1&&dd===today.getDate();
    const key=`${dy}-${String(dm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
    const dow=date.getDay();
    const lunar=lunarOf(dy,dm,dd);
    const jq=lunar.getJieQi();

    const cell=document.createElement('div');
    const dayGz=lunar.getDayInGanZhi();
    const isTracked=mode==='ganzhi'&&gzTracked.has(dayGz);
    const _remind=getLmRemind(lunar);
    const remindLabel=_remind?_remind.label:null;
    const isLmRemind=remindLabel&&mode==='lunar'; // 農曆框只在農曆模式
    const _solRemind=getSolRemind(dm,dd);
    const solRemindLabel=_solRemind?_solRemind.label:null;
    const isSolRemind=!!solRemindLabel; // 國曆框兩種模式都顯示
    cell.className='day-cell'+(isTdy?' today':'')+(selectedKey===key?' selected':'')+(isTracked?' gz-tracked':'')+(isLmRemind?' lm-remind':'')+(isSolRemind&&!isTracked&&!isLmRemind?' sol-remind':'');
    cell.dataset.date=key;

    // ── 格頂標籤 ──
    const {gzLabel,lmLabel}=getCellTopLabels(dy,dm,dd);
    if(gzLabel||lmLabel){
      const topDiv=document.createElement('div');
      topDiv.className='cell-top';
      if(gzLabel){
        const s=document.createElement('span');
        s.className='gz-month-tag';
        s.textContent=gzLabel;
        topDiv.appendChild(s);
      }
      if(lmLabel){
        const s=document.createElement('span');
        s.className='lm-month-tag';
        s.textContent=lmLabel;
        topDiv.appendChild(s);
      }
      cell.appendChild(topDiv);
    }

    // ── 左欄：數字 + 農曆/干支 ──
    const cellLeft=document.createElement('div');
    cellLeft.className='cell-left';

    const numEl=document.createElement('span');
    numEl.className='day-num';
    numEl.textContent=dd===1?dm+"/1":dd;
    if(dow===0) numEl.style.color='var(--red)';
    cellLeft.appendChild(numEl);

    const subEl=document.createElement('span');
    subEl.className='day-sub';
    if(mode==='lunar'){
      subEl.textContent=lunar.getDayInChinese();
    } else {
      const gz=lunar.getDayInGanZhi();
      subEl.textContent=gz;
      subEl.style.color=GAN_COLOR[gz[0]]||'var(--dim)';
    }
    cellLeft.appendChild(subEl);

    // ── 中間橫排容器（左欄 + 節氣） ──
    const cellMid=document.createElement('div');
    cellMid.className='cell-mid';
    cellMid.appendChild(cellLeft);  // 先放左欄，節氣後面加

    // ── 節氣加進 cellMid ──
    if(jq){
      const jqEl=document.createElement('div');
      jqEl.className='jq-label';
      const jqInner=document.createElement('span');
      jqInner.className='jq-inner';
      jqInner.textContent=jq;
      jqEl.appendChild(jqInner);
      cellMid.appendChild(jqEl);
    }
    // ── 正確 DOM 順序：cellMid → 提醒文字 → note-dot ──
    cell.appendChild(cellMid);

    if(remindLabel){
      const remind=lmReminds[Object.keys(lmReminds).find(k=>{
        const[km,kd]=k.split('-').map(Number);
        return km===Math.abs(lunar.getMonth())&&kd===lunar.getDay();
      })];
      const since=remind&&remind.since!=null?remind.since:null;
      const yearCount=since!=null?` (${dy-since})`:'';
      const rl=document.createElement('span');
      rl.className='remind-label';
      rl.textContent=remindLabel+yearCount;
      cell.appendChild(rl);
    }

    if(solRemindLabel){
      const since=_solRemind.since!=null?_solRemind.since:null;
      const yearCount=since!=null?` (${dy-since})`:'';
      const sl=document.createElement('span');
      sl.className='sol-remind-label';
      sl.textContent=solRemindLabel+yearCount;
      cell.appendChild(sl);
    }

    if(localStorage.getItem('cal_note_'+key)){
      const dot=document.createElement('span');dot.className='note-dot';dot.textContent='●';cell.appendChild(dot);
    }

    attachCellEvents(cell, key, dy, dm, dd, lunar);
    container.appendChild(cell);
  }
}

// ── 格子事件 ──
// 【桌機滑鼠】單擊=選取/泡泡，雙擊=開備註
// 【手機觸控】單擊=選取/泡泡，快速雙擊（350ms內）=開備註
function attachCellEvents(cell, key, dy, dm, dd, lunar){
  let pointerType='';
  let startX=0, startY=0;
  let movedTouch=false;
  let touchClickTimer=null;
  const DBL_MS=350;

  cell.addEventListener('pointerdown', e=>{
    pointerType=e.pointerType;
    startX=e.clientX; startY=e.clientY;
    movedTouch=false;
  },{passive:true});

  cell.addEventListener('pointermove', e=>{
    if(pointerType==='touch'){
      if(Math.abs(e.clientX-startX)>10||Math.abs(e.clientY-startY)>10)
        movedTouch=true;
    }
  },{passive:true});

  // 桌機雙擊 → 開備註
  cell.addEventListener('dblclick', e=>{
    if(swipeBlocked) return;
    e.preventDefault();
    openModal(key, dy, dm, dd, lunar);
  });

  // click：桌機單擊直接選取；觸控計時雙擊
  cell.addEventListener('click', e=>{
    if(swipeBlocked) return;

    if(pointerType==='touch'){
      if(movedTouch) return;
      if(touchClickTimer){
        clearTimeout(touchClickTimer); touchClickTimer=null;
        openModal(key, dy, dm, dd, lunar);
      } else {
        touchClickTimer=setTimeout(()=>{
          touchClickTimer=null;
          if(!swipeBlocked&&cell.isConnected) handleClick(key, cell);
        }, DBL_MS);
      }
    } else {
      // 桌機：單擊選取，雙擊由 dblclick 獨立處理
      handleClick(key, cell);
    }
  });
}

// ── Header ──
function updateHeader(){
  document.getElementById('main-title').textContent=`${vy}年 ${vm}月`;
  const mid=Solar.fromYmd(vy,vm,15).getLunar();
  document.getElementById('ganzhi-year').textContent=mid.getYearInGanZhiByLiChun()+'年';
  const btn=document.getElementById('mode-btn');
  if(mode==='ganzhi'){btn.textContent='干支';btn.classList.add('active');}
  else{btn.textContent='農曆';btn.classList.remove('active');}
}

// 只保留畫面附近的週列；補入前方日期時補償捲動位置。
const viewport=document.getElementById('cal-viewport');
const calendarGrid=document.getElementById('cal-grid');
let firstWeek=null, weekHeight=100, weekCount=0;
let scrollFrame=0, scrollEndTimer=null;
const BUFFER_WEEKS=8, INITIAL_WEEKS=25, MAX_WEEKS=41;

function addDays(date,days){
  return new Date(date.getFullYear(),date.getMonth(),date.getDate()+days,12);
}
function weekOf(date){ return addDays(date,-date.getDay()); }
function topDate(){
  return addDays(firstWeek,Math.floor(viewport.scrollTop/weekHeight)*7);
}
function makeWeek(date){
  const row=document.createElement('div');
  row.className='cal-week';
  renderWeek(row,date);
  return row;
}
function updateVisibleMonth(){
  // 頂端週列跨月時顯示新月份，跳轉月初也能立即看到目標月份。
  const date=addDays(topDate(),6);
  vy=date.getFullYear();vm=date.getMonth()+1;
  updateHeader();
}
function buildCalendar(date,offset=0){
  firstWeek=addDays(weekOf(date),-BUFFER_WEEKS*7);
  weekCount=INITIAL_WEEKS;
  const rows=document.createDocumentFragment();
  for(let i=0;i<weekCount;i++) rows.appendChild(makeWeek(addDays(firstWeek,i*7)));
  calendarGrid.replaceChildren(rows);
  viewport.scrollTop=BUFFER_WEEKS*weekHeight+offset;
  updateVisibleMonth();
}
function render(){
  hideBubble();
  if(firstWeek){
    const date=topDate(),offset=viewport.scrollTop%weekHeight;
    buildCalendar(date,offset);
  }else{
    weekHeight=Math.max(72,Math.round(viewport.clientHeight/6));
    calendarGrid.style.setProperty('--week-height',weekHeight+'px');
    buildCalendar(new Date(vy,vm-1,1,12));
  }
}
function changeMonth(delta){
  selectedKey=null;hideBubble();
  buildCalendar(new Date(vy,vm-1+delta,1,12));
}
function extendCalendar(){
  if(viewport.scrollTop<weekHeight*3){
    const rows=document.createDocumentFragment();
    firstWeek=addDays(firstWeek,-BUFFER_WEEKS*7);
    for(let i=0;i<BUFFER_WEEKS;i++) rows.appendChild(makeWeek(addDays(firstWeek,i*7)));
    calendarGrid.prepend(rows);
    weekCount+=BUFFER_WEEKS;
    viewport.scrollTop+=BUFFER_WEEKS*weekHeight;
    while(weekCount>MAX_WEEKS){calendarGrid.lastElementChild.remove();weekCount--;}
  }
  if(viewport.scrollHeight-viewport.scrollTop-viewport.clientHeight<weekHeight*3){
    const rows=document.createDocumentFragment();
    for(let i=0;i<BUFFER_WEEKS;i++) rows.appendChild(makeWeek(addDays(firstWeek,(weekCount+i)*7)));
    calendarGrid.appendChild(rows);
    weekCount+=BUFFER_WEEKS;
    const excess=Math.max(0,weekCount-MAX_WEEKS);
    for(let i=0;i<excess;i++) calendarGrid.firstElementChild.remove();
    if(excess){
      firstWeek=addDays(firstWeek,excess*7);
      weekCount-=excess;
      viewport.scrollTop-=excess*weekHeight;
    }
  }
}
viewport.addEventListener('scroll',()=>{
  hideBubble();swipeBlocked=true;
  clearTimeout(scrollEndTimer);
  scrollEndTimer=setTimeout(()=>swipeBlocked=false,150);
  if(scrollFrame) return;
  scrollFrame=requestAnimationFrame(()=>{
    scrollFrame=0;
    extendCalendar();
    updateVisibleMonth();
  });
},{passive:true});
// 旋轉螢幕或外層導覽列改變高度時，保留頂端週與週內位置。
new ResizeObserver(()=>{
  if(!firstWeek||!viewport.clientHeight) return;
  const nextHeight=Math.max(72,Math.round(viewport.clientHeight/6));
  if(Math.abs(nextHeight-weekHeight)<0.5) return;
  const date=topDate(),fraction=(viewport.scrollTop%weekHeight)/weekHeight;
  weekHeight=nextHeight;
  calendarGrid.style.setProperty('--week-height',weekHeight+'px');
  buildCalendar(date,fraction*weekHeight);
}).observe(viewport);

// ── 點擊與泡泡 ──
function handleClick(key,el){
  hideBubble();
  document.querySelectorAll('.day-cell.selected').forEach(c=>c.classList.remove('selected'));
  if(selectedKey===key){selectedKey=null;return;}
  selectedKey=key; el.classList.add('selected');
  const note=localStorage.getItem('cal_note_'+key);
  if(note) showBubble(el,note);
}

function showBubble(el,text){
  const b=document.getElementById('note-bubble');
  b.textContent=text; b.style.display='block';
  const r=el.getBoundingClientRect();
  const bh=b.offsetHeight||50;
  const above=r.top>bh+16;
  b.className='note-bubble '+(above?'bubble-above':'bubble-below');
  b.style.top=above?(r.top-bh-8)+'px':(r.bottom+8)+'px';
  b.style.left=Math.max(6,Math.min(window.innerWidth-186,r.left+r.width/2-90))+'px';
}
function hideBubble(){document.getElementById('note-bubble').style.display='none';}

function exportNotes(){
  // 完整備份：備註 + 干支追蹤 + 農曆提醒 + 國曆提醒
  const notes={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.startsWith('cal_note_')) notes[k.replace('cal_note_','')]=localStorage.getItem(k);
  }
  const backup={
    version:1,
    exported:new Date().toISOString(),
    notes,                          // 日期備註
    gz_tracked:[...gzTracked],      // 干支追蹤
    lm_reminds:lmReminds,           // 農曆提醒
    sol_reminds:solReminds,         // 國曆提醒
  };
  const hasData=Object.keys(notes).length||gzTracked.size||
    Object.keys(lmReminds).length||Object.keys(solReminds).length;
  if(!hasData){alert('目前沒有任何資料可匯出');return;}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}));
  a.download='干支曆備份_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);closeIOModal();
}
function importNotes(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const raw=JSON.parse(e.target.result);
      let noteCount=0, gzCount=0, lmCount=0, solCount=0;

      // 相容舊格式（只有備註的 JSON）和新格式
      const data=raw.version===1?raw:{notes:raw};

      // 疊加備註
      if(data.notes){
        for(const[k,v] of Object.entries(data.notes)){
          if(typeof v==='string'&&v.trim()){
            localStorage.setItem('cal_note_'+k,v); noteCount++;
          }
        }
      }
      // 疊加干支追蹤
      if(Array.isArray(data.gz_tracked)){
        data.gz_tracked.forEach(gz=>{ gzTracked.add(gz); gzCount++; });
        saveGzTracked();
      }
      // 疊加農曆提醒
      if(data.lm_reminds){
        for(const[k,v] of Object.entries(data.lm_reminds)){
          lmReminds[k]=typeof v==='string'?{label:v,since:null}:v; lmCount++;
        }
        saveLmReminds();
      }
      // 疊加國曆提醒
      if(data.sol_reminds){
        for(const[k,v] of Object.entries(data.sol_reminds)){
          solReminds[k]=typeof v==='string'?{label:v,since:null}:v; solCount++;
        }
        saveSolReminds();
      }

      input.value='';closeIOModal();render();
      alert(`匯入完成（疊加）\n備註：${noteCount} 筆\n干支追蹤：${gzCount} 筆\n農曆提醒：${lmCount} 筆\n國曆提醒：${solCount} 筆`);
    }catch{ alert('檔案格式錯誤，請確認是否為本應用匯出的 JSON'); }
  };
  r.readAsText(file);
}

function makeLabelEditable(span, key, dataObj, saveFn, rerenderFn){
  span.style.cursor='pointer';
  span.title='點擊修改標籤';
  span.addEventListener('click', ()=>{
    const inp=document.createElement('input');
    inp.type='text';
    inp.className='tag-edit-input';
    inp.value=dataObj[key].label||dataObj[key];
    inp.maxLength=12;
    span.replaceWith(inp);
    inp.focus();
    inp.select();
    function commit(){
      const v=inp.value.trim();
      if(v&&v!==(dataObj[key].label||dataObj[key])){
        if(typeof dataObj[key]==='object') dataObj[key].label=v;
        else dataObj[key]=v;
        saveFn();
        rerenderFn();
        render();
      } else {
        rerenderFn();
      }
    }
    inp.addEventListener('blur', commit);
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ inp.blur(); } if(e.key==='Escape'){ rerenderFn(); } });
  });
}

function buildYearOptions(selectedVal){
  const thisYear=new Date().getFullYear();

  for(let y=thisYear;y>=1900;y--){

  }
  return opts;
}

      if(String(v)===d) o.selected=true;
      solDaySel.appendChild(o);
    });
    solDaySel.addEventListener('change',()=>updateSolMonDay(k, solMonSel.value, solDaySel.value));

    const labelSpan=document.createElement('span');
    labelSpan.className='gz-tag-text';
    labelSpan.style.cssText='font-size:13px;flex:1;cursor:pointer;';
    labelSpan.textContent=item.label+(since!=null?` (${new Date().getFullYear()-since})`:'');
    makeLabelEditable(labelSpan, k, solReminds, saveSolReminds, renderSolList);

    const delBtn=document.createElement('button');
    delBtn.className='gz-tag-del';
    delBtn.textContent='✕';
    delBtn.onclick=()=>removeSolRemind(k);

    line1.appendChild(solMonSel);
    line1.appendChild(solDaySel);
    line1.appendChild(labelSpan);
    line1.appendChild(delBtn);

    const line2=document.createElement('div');
    line2.style.cssText='display:flex;align-items:center;gap:6px;';
    line2.innerHTML=`<span style="font-size:11px;color:var(--dim);white-space:nowrap;">起始年</span>
      <select class="lm-select" style="flex:1;padding:5px 6px;font-size:12px;" onchange="updateSolSince('${k}',this.value)">${buildYearOptions(since)}</select>`;

    row.appendChild(line1);
    row.appendChild(line2);
    list.appendChild(row);
  });
}

render();
</script>
</body>
</html>
