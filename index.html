<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>玄學樞紐</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: #0f0e0c; color: #d4a75b; 
            font-family: "PingFang TC", sans-serif; display: flex; 
            flex-direction: column; height: 100vh; overflow: hidden; 
        }
        
        /* 導覽列：確保在電腦端置中且不撐開 */
        .nav-container {
            display: flex; justify-content: center; align-items: center;
            padding: env(safe-area-inset-top, 20px) 15px 15px 15px;
            background: rgba(0,0,0,0.3); z-index: 100;
            border-bottom: 1px solid rgba(212,167,91,0.2);
            backdrop-filter: blur(10px);
        }

        .nav-content {
            display: flex; align-items: center;
            gap: 15px; 
            max-width: 700px; /* 限制寬度防止電腦版過寬 */
            width: 100%; justify-content: center;
        }

        .tab-group { 
            display: flex; gap: 8px; 
            overflow-x: auto; /* 手機版若按鈕過多可微調滑動 */
            scrollbar-width: none;
        }
        .tab-group::-webkit-scrollbar { display: none; }

        .nav-btn { 
            padding: 8px 14px; font-weight: 900; font-size: 13px; 
            color: #d4a75b; opacity: 0.4; border-radius: 10px; 
            cursor: pointer; transition: 0.3s; white-space: nowrap;
        }
        .nav-btn.active { opacity: 1; background: rgba(212,167,91,0.15); }

        .nav-arrow { 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            color: #d4a75b; opacity: 0.4; padding: 10px;
            user-select: none;
        }
        .nav-arrow:active { transform: scale(0.8); opacity: 1; }

        .nav-title {
            position: absolute; top: 5px; font-size: 10px; 
            letter-spacing: 2px; opacity: 0.6; font-weight: bold;
        }

        iframe { flex: 1; width: 100%; border: none; background: #0f0e0c; }
    </style>
</head>
<body>

<div class="nav-container">
    <div class="nav-title" id="app-display-name">子午流注</div>

    <div class="nav-content">
        <div class="nav-arrow" onclick="prevApp()">&#10094;</div>
        
        <div class="tab-group">
            <div class="nav-btn active" onclick="switchApp(0)">子午流注</div>
            <div class="nav-btn" onclick="switchApp(1)">十神五極</div>
            <div class="nav-btn" onclick="switchApp(2)">地支藏干</div>
            <div class="nav-btn" onclick="switchApp(3)">九宮飛星</div>
        </div>
        
        <div class="nav-arrow" onclick="nextApp()">&#10095;</div>
    </div>
</div>

<iframe id="main-frame" src="ZW clock.html"></iframe>

<script>
    const apps = [
        { name: '子午流注', file: 'ZW clock.html' },
        { name: '十神五極', file: '101010.html' },
        { name: '地支藏干', file: '12 h.html' },
        { name: '九宮飛星', file: '9P.html' }
    ];
    
    let currentIndex = 0;

    function switchApp(index) {
        currentIndex = index;
        updateUI();
    }

    function prevApp() {
        currentIndex = (currentIndex - 1 + apps.length) % apps.length;
        updateUI();
    }

    function nextApp() {
        currentIndex = (currentIndex + 1) % apps.length;
        updateUI();
    }

    function updateUI() {
        const frame = document.getElementById('main-frame');
        const btns = document.querySelectorAll('.nav-btn');
        const title = document.getElementById('app-display-name');
        
        // 切換檔案
        frame.src = apps[currentIndex].file;
        
        // 更新標題
        title.textContent = apps[currentIndex].name;
        
        // 更新按鈕高亮狀態
        btns.forEach((btn, i) => {
            btn.classList.toggle('active', i === currentIndex);
        });
    }
</script>
</body>
</html>
