<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>玄學樞紐</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: #0f0e0c; color: #d4a75b; 
            font-family: "PingFang TC", sans-serif; display: flex; 
            flex-direction: column; height: 100vh; overflow: hidden; 
            transition: background 0.4s ease;
        }

        body.light-theme { background: #e9e4d1; color: #5d5d4d; }
        
        /* --- 導覽列佈局：三鍵+兩側箭頭 --- */
        .nav-container {
            display: flex; justify-content: center; align-items: center;
            padding: env(safe-area-inset-top, 20px) 15px 15px 15px;
            background: rgba(0,0,0,0.2); z-index: 100;
            border-bottom: 1px solid rgba(212,167,91,0.15);
            backdrop-filter: blur(10px);
        }

        /* 限制導覽內容最大寬度，防止在電腦端兩側過開 */
        .nav-content {
            display: flex; align-items: center;
            gap: 20px; /* 箭頭與按鈕組的距離 */
            max-width: 600px; width: 100%; justify-content: center;
        }

        .tab-group { display: flex; gap: 10px; }

        .nav-btn { 
            padding: 8px 16px; font-weight: 900; font-size: 14px; 
            color: inherit; opacity: 0.4; border-radius: 12px; 
            cursor: pointer; transition: 0.3s; white-space: nowrap;
        }
        .nav-btn.active { opacity: 1; background: rgba(128,128,128,0.15); }

        .nav-arrow { 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            opacity: 0.4; transition: 0.2s; padding: 10px;
        }
        .nav-arrow:active { transform: scale(0.8); opacity: 1; }

        iframe { flex: 1; width: 100%; border: none; }
    </style>
</head>
<body>

<div class="nav-container">
    <div class="nav-content">
        <div class="nav-arrow" onclick="prevApp()">&#10094;</div>
        
        <div class="tab-group">
            <div class="nav-btn active" onclick="switchApp(0)">子午流注</div>
            <div class="nav-btn" onclick="switchApp(1)">十神五極</div>
            <div class="nav-btn" onclick="switchApp(2)">地支藏干</div>
        </div>
        
        <div class="nav-arrow" onclick="nextApp()">&#10095;</div>
    </div>
</div>

<iframe id="main-frame" src="ZW clock.html"></iframe>

<script>
    const apps = [
        { name: '子午流注', file: 'ZW clock.html' },
        { name: '十神五極', file: '101010.html' },
        { name: '地支藏干', file: '12 h.html' }
    ];
    
    let currentIndex = 0;
    let currentTheme = 'dark'; // 預設深色

    function switchApp(index) {
        currentIndex = index;
        updateUI();
    }

    function prevApp() {
        currentIndex = (currentIndex - 1 + apps.length) % apps.length;
        updateUI();
    }

    function nextApp() {
        currentIndex = (currentIndex + 1) % apps.length;
        updateUI();
    }

    function updateUI() {
        const frame = document.getElementById('main-frame');
        const btns = document.querySelectorAll('.nav-btn');
        
        // 切換檔案
        frame.src = apps[currentIndex].file;
        
        // 更新按鈕樣式
        btns.forEach((btn, i) => {
            btn.classList.toggle('active', i === currentIndex);
        });

        // 重點：當 Iframe 載入完成後，自動把目前的主題同步進去
        frame.onload = () => syncThemeToFrame();
    }

    // --- 主題同步邏輯 ---
    function syncThemeToFrame() {
        const frame = document.getElementById('main-frame');
        frame.contentWindow.postMessage({ type: 'SET_THEME', theme: currentTheme }, '*');
    }

    // 監聽來自子頁面的主題切換請求
    window.addEventListener('message', (event) => {
        if (event.data.type === 'TOGGLE_THEME') {
            currentTheme = (currentTheme === 'dark' ? 'light' : 'dark');
            document.body.classList.toggle('light-theme', currentTheme === 'light');
            // 同步給目前看得到的 iframe
            syncThemeToFrame();
        }
    });
</script>
</body>
</html>
