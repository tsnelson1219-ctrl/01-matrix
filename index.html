<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>玄學樞紐</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; padding: 0; background: #0f0e0c; color: #d4a75b; 
            font-family: "PingFang TC", sans-serif; display: flex; 
            flex-direction: column; height: 100vh; overflow: hidden; 
        }
        
        /* 導覽列：極簡高度設計，確保不擠壓下方內容 */
        .nav-container {
            display: flex; justify-content: center; align-items: center;
            /* 僅保留必要的瀏海區安全間距與極小內距 */
            padding: env(safe-area-inset-top, 10px) 15px 10px 15px;
            background: rgba(0,0,0,0.4); z-index: 100;
            border-bottom: 1px solid rgba(212,167,91,0.2);
            backdrop-filter: blur(10px);
            flex-shrink: 0; /* 防止導覽列被 iframe 擠壓變形 */
        }

        .nav-content {
            display: flex; align-items: center;
            gap: 12px; 
            max-width: 650px; /* 電腦版寬度限制 */
            width: 100%; justify-content: center;
        }

                .tab-group {
            display: flex; gap: 8px; flex-grow: 1; justify-content: flex-start;
            overflow-x: auto; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            -ms-overflow-style: none;
            /* 左右 padding 讓首尾 tab 不貼邊，同時不影響捲動起點 */
            padding: 0 12px;
        }
        .tab-group::-webkit-scrollbar { display: none; }
        
        .nav-btn {
            padding: 8px 12px; font-size: 14px; color: rgba(212,167,91,0.85);
            background: transparent; border: 1px solid transparent; 
            border-radius: 20px; cursor: pointer; transition: all 0.2s;
            white-space: nowrap; flex-shrink: 0;
        }
        .nav-btn.active { 
            opacity: 1; 
            background: rgba(212,167,91,0.18); 
            border: 1px solid rgba(212,167,91,0.45);
        }

        /* 淺色模式：導覽列 */
        body.light-mode .nav-container {
            background: rgba(245,238,220,0.85);
            border-bottom: 1px solid rgba(120,80,30,0.2);
        }
        body.light-mode .nav-btn {
            color: rgba(100,60,10,0.85);
        }
        body.light-mode .nav-btn.active {
            background: rgba(100,60,10,0.1);
            border: 1px solid rgba(100,60,10,0.3);
        }
        body.light-mode .nav-arrow {
            color: #6b3e10;
        }
        body.light-mode .theme-btn {
            border-color: rgba(100,60,10,0.5);
            color: #6b3e10;
        }
        body.light-mode {
            background: #f5eedc;
        }

        .nav-arrow { 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            color: #d4a75b; opacity: 0.4; padding: 5px 10px;
            user-select: none;
        }
        .nav-arrow:active { transform: scale(0.8); opacity: 1; }

        .theme-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(212,167,91,0.6); background: transparent;
            color: #d4a75b; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* iframe 填滿剩餘空間 */
        iframe { 
            flex: 1; width: 100%; border: none; background: #0f0e0c; 
            display: block; /* 消除底邊縫隙 */
        }
    </style>
</head>
<body>

<div class="nav-container">
    <div class="nav-content">
        <div class="nav-arrow" onclick="prevApp()">&#10094;</div>
        
        <div class="tab-group">
            <div class="nav-btn active" onclick="switchApp(0)">子午流注</div>
            <div class="nav-btn" onclick="switchApp(1)">十神五極</div>
            <div class="nav-btn" onclick="switchApp(2)">地支藏干</div>
            <div class="nav-btn" onclick="switchApp(3)">九宮飛星</div>
            <div class="nav-btn" onclick="switchApp(4)">12長生</div>
            <div class="nav-btn" onclick="switchApp(5)">干支曆</div>
        </div>
        
        <div class="nav-arrow" onclick="nextApp()">&#10095;</div>
        <button class="theme-btn" onclick="toggleTheme()">◑</button>
    </div>
</div>

<iframe id="main-frame" src="ZW clock.html"></iframe>

<script>
    // 確保檔案名稱與您資料夾內的完全一致
    const apps = [
        { name: '子午流注', file: 'ZW clock.html' },
        { name: '十神五極', file: '101010.html' },
        { name: '地支藏干', file: '12 h.html' },
        { name: '九宮飛星', file: '9P.html' },
        { name: '12長生', file: '12life.html' },
        { name: '干支曆', file: 'cal.html' }
    ];
    
    let currentIndex = 0;

    function switchApp(index) {
        currentIndex = index;
        updateUI();
    }

    function prevApp() {
        currentIndex = (currentIndex - 1 + apps.length) % apps.length;
        updateUI();
    }

    function nextApp() {
        currentIndex = (currentIndex + 1) % apps.length;
        updateUI();
    }

    function updateUI() {
        const frame = document.getElementById('main-frame');
        const btns = document.querySelectorAll('.nav-btn');
        frame.src = apps[currentIndex].file;
        // 切換後等頁面載入，再把主題注入
        frame.onload = () => applyThemeToFrame(frame);
        btns.forEach((btn, i) => {
            const isActive = (i === currentIndex);
            btn.classList.toggle('active', isActive);
            if (isActive) {
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });
    }

    // 主題同步：用 localStorage 記住狀態，每次載入 iframe 時注入
    function applyThemeToFrame(frame) {
        const isLight = localStorage.getItem('theme') === 'light';
        try {
            const doc = frame.contentDocument || frame.contentWindow.document;
            const body = doc.body;
            // 各頁面 class 名稱對應
            const lightClasses = ['light-mode', 'light-theme', 'light-theme', 'light-theme'];
            const darkClasses  = ['', '', '', 'dark-theme'];
            // 用檔名判斷要用哪個 class
            const src = frame.src;
            let lightClass = 'light-mode', darkClass = '';
            if (src.includes('101010')) { lightClass = ''; darkClass = 'dark-theme'; }
            else if (src.includes('12') || src.includes('ZW') || src.includes('clock')) { lightClass = 'light-theme'; darkClass = ''; }

            if (src.includes('101010')) {
                body.classList.toggle('dark-theme', !isLight);
            } else if (src.includes('cal')) {
                body.classList.toggle('light', isLight);
            } else if (src.includes('12') || src.includes('ZW') || src.includes('clock')) {
                body.classList.toggle('light-theme', isLight);
            } else {
                body.classList.toggle('light-mode', isLight);
            }
        } catch(e) {}
    }

    function toggleTheme() {
        const isLight = localStorage.getItem('theme') === 'light';
        const newTheme = isLight ? 'dark' : 'light';
        localStorage.setItem('theme', newTheme);
        // 更新導覽列本身的主題
        document.body.classList.toggle('light-mode', newTheme === 'light');
        const frame = document.getElementById('main-frame');
        applyThemeToFrame(frame);
    }

    // 頁面載入時，套用已儲存的主題到導覽列
    (function initTheme() {
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
        }
    })();

    // 頁面初次載入也注入主題
    document.getElementById('main-frame').onload = function() {
        applyThemeToFrame(this);
    };
</script>
</body>
</html>
