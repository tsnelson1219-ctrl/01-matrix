<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>道可道，非常道</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html {
            /* dvh 自動扣除手機瀏覽器底部導覽列 */
            height: 100dvh;
            min-height: -webkit-fill-available;
        }
        body { 
            margin: 0; padding: 0; background: #0f0e0c; color: #d4a75b; 
            font-family: "PingFang TC", sans-serif; display: flex; 
            flex-direction: column;
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden; 
        }
        
        /* 導覽列：極簡高度設計，確保不擠壓下方內容 */
        .nav-container {
            display: flex; justify-content: center; align-items: center;
            /* 僅保留必要的瀏海區安全間距與極小內距 */
            padding: env(safe-area-inset-top, 10px) 15px 10px 15px;
            background: rgba(0,0,0,0.4); z-index: 100;
            border-bottom: 1px solid rgba(212,167,91,0.2);
            backdrop-filter: blur(10px);
            flex-shrink: 0; /* 防止導覽列被 iframe 擠壓變形 */
        }

        .nav-content {
            display: flex; align-items: center;
            gap: 12px; 
            max-width: 650px; /* 電腦版寬度限制 */
            width: 100%; justify-content: center;
        }

                .tab-group {
            display: flex; gap: 8px; flex-grow: 1; justify-content: flex-start;
            overflow-x: auto; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; scrollbar-width: none;
            -ms-overflow-style: none;
            /* 左右 padding 讓首尾 tab 不貼邊，同時不影響捲動起點 */
            padding: 0 12px;
        }
        .tab-group::-webkit-scrollbar { display: none; }
        
        .nav-btn {
            padding: 8px 12px; font-size: 14px; color: rgba(212,167,91,0.85);
            background: transparent; border: 1px solid transparent; 
            border-radius: 20px; cursor: pointer; transition: all 0.2s;
            white-space: nowrap; flex-shrink: 0;
        }
        .nav-btn.active { 
            opacity: 1; 
            background: rgba(212,167,91,0.18); 
            border: 1px solid rgba(212,167,91,0.45);
        }

        /* 淺色模式：導覽列 */
        body.light-mode .nav-container {
            background: rgba(245,238,220,0.85);
            border-bottom: 1px solid rgba(120,80,30,0.2);
        }
        body.light-mode .nav-btn {
            color: rgba(100,60,10,0.85);
        }
        body.light-mode .nav-btn.active {
            background: rgba(100,60,10,0.1);
            border: 1px solid rgba(100,60,10,0.3);
        }
        body.light-mode .nav-arrow {
            color: #6b3e10;
        }
        body.light-mode .theme-btn {
            border-color: rgba(100,60,10,0.5);
            color: #6b3e10;
        }
        body.light-mode {
            background: #f5eedc;
        }

        .nav-arrow { 
            font-size: 18px; font-weight: bold; cursor: pointer; 
            color: #d4a75b; opacity: 0.4; padding: 5px 10px;
            user-select: none;
        }
        .nav-arrow:active { transform: scale(0.8); opacity: 1; }

        .theme-btn {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(212,167,91,0.6); background: transparent;
            color: #d4a75b; font-size: 16px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }

        /* iframe 填滿剩餘空間，底部留出手機導覽列安全區 */
        iframe { 
            flex: 1; width: 100%; border: none; background: #0f0e0c; 
            display: block;
            /* 關鍵：讓 iframe 底部不被手機導覽列遮住 */
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>
<body>

<div class="nav-container">
    <div class="nav-content">
        <div class="nav-arrow" onclick="prevApp()">&#10094;</div>
        
        <div class="tab-group">
            <div class="nav-btn active" onclick="switchApp(0)">子午流注</div>
            <div class="nav-btn" onclick="switchApp(1)">干支曆</div>
            <div class="nav-btn" onclick="switchApp(2)">十神五極</div>
            <div class="nav-btn" onclick="switchApp(3)">地支藏干</div>
            <div class="nav-btn" onclick="switchApp(4)">12長生</div>
            <div class="nav-btn" onclick="switchApp(5)">九宮飛星</div>
        </div>
        
        <div class="nav-arrow" onclick="nextApp()">&#10095;</div>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="切換深淺色主題" aria-pressed="false">◑</button>
    </div>
</div>

<iframe id="main-frame" src="ZW clock.html"></iframe>

<script>
    // 明確對應各頁既有主題，不以完整網址猜測頁型。
    const apps = [
        {"name":"子午流注","file":"ZW clock.html","themeClass":"light-theme","darkClass":false,"themeControl":".theme-switch"},
        {"name":"干支曆","file":"cal.html","themeClass":"light","darkClass":false,"themeControl":".theme-btn"},
        {"name":"十神五極","file":"101010.html","themeClass":"dark-theme","darkClass":true,"themeControl":".theme-btn"},
        {"name":"地支藏干","file":"12 h.html","themeClass":"light-theme","darkClass":false,"themeControl":".theme-switch"},
        {"name":"12長生","file":"12life.html","themeClass":"light-theme","darkClass":false,"themeControl":".theme-switch"},
        {"name":"九宮飛星","file":"9P.html","themeClass":"light-mode","darkClass":false,"themeControl":".theme-toggle"}
    ];

    let currentIndex = 0;

    function switchApp(index) {
        currentIndex = index;
        updateUI();
    }

    function prevApp() {
        currentIndex = (currentIndex - 1 + apps.length) % apps.length;
        updateUI();
    }

    function nextApp() {
        currentIndex = (currentIndex + 1) % apps.length;
        updateUI();
    }

    function updateUI() {
        const frame = document.getElementById('main-frame');
        const btns = document.querySelectorAll('.nav-btn');
        frame.src = apps[currentIndex].file;
        btns.forEach((btn, i) => {
            const isActive = (i === currentIndex);
            btn.classList.toggle('active', isActive);
            if (isActive) {
                btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }
        });
    }

    // 儲存不可用時，仍可在目前頁面切換主題。
    function readTheme() {
        try { return localStorage.getItem('theme') === 'light' ? 'light' : 'dark'; }
        catch (error) { return 'dark'; }
    }
    let currentTheme = readTheme();

    function applyThemeToFrame(frame) {
        const doc = frame.contentDocument;
        if (!doc || !doc.body) return;
        const app = apps[currentIndex];
        doc.body.classList.toggle(app.themeClass,
            app.darkClass ? currentTheme === 'dark' : currentTheme === 'light');

        // 只影響嵌入頁面，保留按鈕原本空間與各頁的獨立開啟行為。
        let style = doc.getElementById('matrix-embedded-theme');
        if (!style) {
            style = doc.createElement('style');
            style.id = 'matrix-embedded-theme';
            doc.head.appendChild(style);
        }
        style.textContent = app.themeControl + ' { visibility: hidden !important; pointer-events: none !important; }';
    }

    function applyTheme() {
        document.body.classList.toggle('light-mode', currentTheme === 'light');
        const button = document.querySelector('.theme-btn');
        button.setAttribute('aria-pressed', String(currentTheme === 'light'));
        button.setAttribute('aria-label', currentTheme === 'light' ? '切換為深色主題' : '切換為淺色主題');
        applyThemeToFrame(document.getElementById('main-frame'));
    }

    function toggleTheme() {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        try { localStorage.setItem('theme', currentTheme); }
        catch (error) { /* 目前頁面仍套用主題。 */ }
        applyTheme();
    }

    // 先綁定載入事件，切換後套用目前選擇；不依賴網址內容。
    document.getElementById('main-frame').addEventListener('load', applyTheme);
    // 另一個同源視窗的獨立分頁切換主題時，也同步整合頁。
    window.addEventListener('storage', event => {
        if (event.key === 'theme' || event.key === null) {
            currentTheme = readTheme();
            applyTheme();
        }
    });
    applyTheme();
</script>
</body>
</html>
